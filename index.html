<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="claude:viewport-fit-sides" content="cover">
<title>Аудит магазина</title>
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#f8bbd9">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#eba9c8">
<meta name="color-scheme" content="light dark">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=Fira+Sans+Extra+Condensed:wght@600;700&display=swap">
<style>/* Аудит магазина — направление «Ценник»: белая бумага ценника, графит, светло-розовая полоса только на оболочке.
   Цифры (баллы, счётчики, сроки) — узкий жирный кегль, десятые подняты как копейки. */
:root {
  --ground: #f1f2f0;
  --paper: #ffffff;
  --paper-2: #f7f8f6;
  --ink: #16181a;
  --ink-2: #4b5156;
  --ink-3: #6b7176;
  --line: #e2e4e1;
  --line-2: #cfd2ce;
  --tag: #f8bbd9;
  --tag-ink: #2d0a1a;
  --ok: #157a3a;
  --ok-tint: #e3f2e8;
  --bad: #c3281d;
  --bad-tint: #fbe7e5;
  --mid: #9c5a00;
  --mid-tint: #fbefdc;
  --na: #6b7176;
  --focus: #1f5fd6;
  --scrim: rgb(22 24 26 / 0.42);
  --shadow-float: 0 8px 28px rgb(22 24 26 / 0.16), 0 2px 6px rgb(22 24 26 / 0.08);

  --font-ui: "Onest", "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
  --font-fig: "Fira Sans Extra Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;

  --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
  --ease-drawer: cubic-bezier(0.32, 0.72, 0, 1);
  --r: 8px;
  --col: 600px;
  --bar-h: 60px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ground: #0f1011; --paper: #18191b; --paper-2: #1e2022; --ink: #eceded; --ink-2: #a9aeb2; --ink-3: #8b9095;
    --line: #2a2d30; --line-2: #3a3e42; --tag: #eba9c8; --tag-ink: #2d0a1a;
    --ok: #4cc27a; --ok-tint: #12301e; --bad: #ff6f62; --bad-tint: #3a1714; --mid: #f0a73a; --mid-tint: #3a2a10; --na: #8b9095;
    --focus: #7aa7ff; --scrim: rgb(0 0 0 / 0.6); --shadow-float: 0 10px 30px rgb(0 0 0 / 0.5);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --ground: #0f1011; --paper: #18191b; --paper-2: #1e2022; --ink: #eceded; --ink-2: #a9aeb2; --ink-3: #8b9095;
  --line: #2a2d30; --line-2: #3a3e42; --tag: #eba9c8; --tag-ink: #2d0a1a;
  --ok: #4cc27a; --ok-tint: #12301e; --bad: #ff6f62; --bad-tint: #3a1714; --mid: #f0a73a; --mid-tint: #3a2a10; --na: #8b9095;
  --focus: #7aa7ff; --scrim: rgb(0 0 0 / 0.6); --shadow-float: 0 10px 30px rgb(0 0 0 / 0.5);
  color-scheme: dark;
}

html { -webkit-tap-highlight-color: transparent; -webkit-text-size-adjust: 100%; overscroll-behavior: none; }
body { background: var(--ground); color: var(--ink); font-family: var(--font-ui); font-size: 15px; line-height: 1.45; margin: 0; }
::selection { background: var(--tag); color: var(--tag-ink); }
* { box-sizing: border-box; }
h1, h2, h3, p { margin: 0; }
h1 { font-size: 22px; line-height: 1.2; font-weight: 700; letter-spacing: -0.01em; text-wrap: balance; }
h2 { font-size: 17px; line-height: 1.25; font-weight: 650; text-wrap: balance; }
h3 { font-size: 15px; font-weight: 600; }
button, input, textarea, select { font: inherit; color: inherit; }
input, textarea, select { font-size: 16px; }
button, a, [role="button"], .chip, .tab { touch-action: manipulation; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: 4px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------- figures: the price-tag numerals ---------- */
.fig { font-family: var(--font-fig); font-weight: 700; font-variant-numeric: tabular-nums lining-nums; line-height: 1; letter-spacing: -0.01em; display: inline-flex; align-items: flex-start; white-space: nowrap; }
.fig .k { font-size: 0.5em; line-height: 1; margin-top: 0.1em; margin-left: 0.04em; }
.fig .u { font-family: var(--font-ui); font-weight: 600; font-size: 0.36em; margin-top: 0.16em; margin-left: 0.18em; color: var(--ink-2); letter-spacing: 0; }
.fig.ok { color: var(--ok); } .fig.mid { color: var(--mid); } .fig.bad { color: var(--bad); } .fig.na { color: var(--ink-3); }
.fig-roll { display: inline-block; }

/* ---------- shell ---------- */
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--tag); }
.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--tag); color: var(--tag-ink); }
.topbar .in { max-width: var(--col); margin: 0 auto; min-height: 52px; display: flex; align-items: center; gap: 10px;
  padding-left: max(12px, env(safe-area-inset-left, 0px)); padding-right: max(12px, env(safe-area-inset-right, 0px)); padding-block: 6px; }
.wide .topbar .in, .wide .page, .wide .tabbar .in { max-width: 1040px; }
.mark { width: 30px; height: 30px; flex: 0 0 auto; display: grid; place-items: center; }
.brand { min-width: 0; flex: 1; display: flex; flex-direction: column; }
.brand b { font-size: 15px; font-weight: 700; line-height: 1.15; }
.brand span { font-size: 12.5px; line-height: 1.2; color: color-mix(in srgb, var(--tag-ink) 78%, var(--tag)); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.iconbtn { width: 44px; height: 44px; display: grid; place-items: center; border: 0; background: transparent; border-radius: 10px; cursor: pointer; color: inherit; flex: 0 0 auto; transition: transform 120ms var(--ease-out), background-color 120ms ease; }
.iconbtn:active { transform: scale(0.94); background: color-mix(in srgb, currentColor 10%, transparent); }
.icon { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: 0 0 auto; }
.icon.sm { width: 18px; height: 18px; }

.page { max-width: var(--col); margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 18px calc(var(--bar-h) + 28px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 20px; }
.page.has-action { padding-bottom: calc(var(--bar-h) + 96px + env(safe-area-inset-bottom, 0px)); }
.page.no-tabs { padding-bottom: calc(110px + env(safe-area-inset-bottom, 0px)); }
.titlerow { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; }
.titlerow p { color: var(--ink-2); font-size: 13.5px; margin-top: 4px; }
.sub { color: var(--ink-2); font-size: 13.5px; }
.back { display: inline-flex; align-items: center; gap: 4px; margin: -6px 0 -8px -10px; padding: 8px 10px; border: 0; background: none; color: var(--ink-2); font-size: 14px; cursor: pointer; border-radius: 8px; min-height: 40px; align-self: flex-start; }
.back:active { background: var(--line); }

.tabbar { position: fixed; inset: auto 0 0; z-index: 20; background: var(--paper); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); }
.tabbar .in { max-width: var(--col); margin: 0 auto; display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); }
.tab { height: var(--bar-h); border: 0; background: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 12px; font-weight: 550; color: var(--ink-3); cursor: pointer; position: relative; }
.tab[aria-current="page"] { color: var(--ink); }
.tab[aria-current="page"]::before { content: ""; position: absolute; top: 0; left: 28%; right: 28%; height: 3px; border-radius: 0 0 3px 3px; background: var(--tag); }
.tab .badge { position: absolute; top: 7px; left: calc(50% + 8px); min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: var(--bad); color: #fff; font-size: 11px; font-weight: 700; display: grid; place-items: center; font-variant-numeric: tabular-nums; }

/* ---------- figure strip (not tiles) ---------- */
.strip { display: grid; grid-template-columns: repeat(3, 1fr); background: var(--paper); border: 1px solid var(--line); border-radius: var(--r); }
.strip > * { padding: 12px 14px 12px; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.strip > * + * { border-left: 1px solid var(--line); }
.strip .fig { font-size: 34px; }
.strip .lbl { font-size: 12.5px; color: var(--ink-2); line-height: 1.25; }
.strip button { appearance: none; border: 0; border-radius: 0; background: none; font: inherit; color: inherit; text-align: left; cursor: pointer; transition: background-color 120ms ease; }
.strip button:active { background: var(--paper-2); }
.strip > :first-child { border-radius: var(--r) 0 0 var(--r); } .strip > :last-child { border-radius: 0 var(--r) var(--r) 0; }
.strip button:focus-visible { outline: 2px solid var(--focus); outline-offset: 4px; }

/* ---------- lists ---------- */
.list { background: var(--paper); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.row { display: flex; align-items: center; gap: 12px; padding: 12px 14px; min-height: 64px; border: 0; background: none; width: 100%; text-align: left; cursor: pointer; transition: background-color 120ms ease; }
.row + .row, .list > * + * { border-top: 1px solid var(--line); }
.row:active { background: var(--paper-2); }
.row .main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.row .t1 { font-weight: 600; display: flex; align-items: baseline; gap: 8px; min-width: 0; }
.row .t1 .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .t2 { font-size: 13px; color: var(--ink-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .end { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; flex: 0 0 auto; }
.row .end .fig { font-size: 28px; }
.code { font-family: var(--font-fig); font-weight: 600; font-size: 16px; letter-spacing: 0.02em; color: var(--ink); font-variant-numeric: tabular-nums; }
.chev { color: var(--ink-3); }
.group-h { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-bottom: 8px; }
.group-h h2 { font-size: 15px; }
.group-h span { font-size: 13px; color: var(--ink-2); }
.empty { padding: 22px 16px; text-align: center; color: var(--ink-2); font-size: 14px; background: var(--paper); border: 1px dashed var(--line-2); border-radius: var(--r); }
.empty b { display: block; color: var(--ink); margin-bottom: 4px; font-size: 15px; }

.pill { display: inline-flex; align-items: center; gap: 4px; height: 22px; padding: 0 8px; border-radius: 11px; font-size: 12px; font-weight: 600; white-space: nowrap; background: var(--line); color: var(--ink-2); }
.pill.ok { background: var(--ok-tint); color: var(--ok); } .pill.bad { background: var(--bad-tint); color: var(--bad); } .pill.mid { background: var(--mid-tint); color: var(--mid); }
.pill.p1 { background: var(--bad-tint); color: var(--bad); } .pill.p2 { background: var(--mid-tint); color: var(--mid); } .pill.p3 { background: var(--line); color: var(--ink-2); }
.pill.wait { background: transparent; box-shadow: inset 0 0 0 1px var(--ink); color: var(--ink); }
.pill.demo { background: transparent; border: 1px dashed var(--line-2); color: var(--ink-3); font-weight: 500; }

/* ---------- segmented / chips ---------- */
.seg { display: flex; gap: 4px; padding: 3px; background: var(--paper); border: 1px solid var(--line); border-radius: 10px; overflow-x: auto; scrollbar-width: none; }
.seg::-webkit-scrollbar { display: none; }
.seg button { flex: 1 0 auto; min-height: 38px; padding: 0 12px; border: 0; border-radius: 7px; background: transparent; font-size: 14px; font-weight: 550; color: var(--ink-2); cursor: pointer; white-space: nowrap; transition: background-color 150ms ease, color 150ms ease; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { min-height: 40px; padding: 0 14px; border: 1px solid var(--line-2); border-radius: 20px; background: var(--paper); font-size: 14px; font-weight: 550; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; transition: transform 120ms var(--ease-out), background-color 150ms ease, border-color 150ms ease; }
.chip:active { transform: scale(0.97); }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }

/* ---------- buttons ---------- */
.btn { min-height: 48px; padding: 0 18px; border-radius: 10px; border: 1px solid var(--line-2); background: var(--paper); font-weight: 650; font-size: 15px; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 8px; transition: transform 140ms var(--ease-out), background-color 150ms ease, opacity 150ms ease; }
.btn:active { transform: scale(0.97); }
.btn.primary { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.btn.good { background: var(--ok); border-color: var(--ok); color: #fff; }
.btn.danger { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 45%, var(--line-2)); }
.btn.block { width: 100%; }
.btn:disabled { opacity: 0.45; cursor: not-allowed; transform: none; }
.btn.small { min-height: 40px; padding: 0 14px; font-size: 14px; }
.linkbtn { border: 0; background: none; padding: 6px 0; color: var(--ink); font-weight: 600; text-decoration: underline; text-underline-offset: 3px; text-decoration-color: var(--line-2); cursor: pointer; font-size: 14px; }

.actionbar { position: fixed; inset: auto 0 calc(var(--bar-h) + env(safe-area-inset-bottom, 0px)); z-index: 15; background: color-mix(in srgb, var(--ground) 92%, transparent); border-top: 1px solid var(--line); }
.no-tabs .actionbar { bottom: 0; padding-bottom: env(safe-area-inset-bottom, 0px); }
.actionbar .in { max-width: var(--col); margin: 0 auto; padding: 10px max(16px, env(safe-area-inset-right, 0px)) 10px max(16px, env(safe-area-inset-left, 0px)); display: flex; gap: 10px; align-items: center; }
.actionbar .in > .btn { flex: 1; }
.actionbar .meta { font-size: 13px; color: var(--ink-2); flex: 0 1 auto; min-width: 0; }

/* ---------- panels ---------- */
.panel { background: var(--paper); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; display: flex; flex-direction: column; gap: 12px; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; font-size: 14px; }
.kv dt { color: var(--ink-2); } .kv dd { margin: 0; text-align: right; font-weight: 550; }
.field { display: flex; flex-direction: column; gap: 6px; }
.field label, .field .lbl { font-size: 13px; color: var(--ink-2); font-weight: 550; }
.input, textarea.input { width: 100%; min-height: 48px; padding: 12px 14px; border: 1px solid var(--line-2); border-radius: 10px; background: var(--paper); transition: border-color 150ms ease; }
textarea.input { min-height: 84px; resize: vertical; line-height: 1.4; }
.input:focus { outline: none; border-color: var(--ink); box-shadow: 0 0 0 3px color-mix(in srgb, var(--focus) 25%, transparent); }
.hint { font-size: 12.5px; color: var(--ink-3); }
.err { font-size: 13px; color: var(--bad); font-weight: 550; }

/* ---------- visit runner ---------- */
.vhead { position: sticky; top: calc(52px + env(safe-area-inset-top, 0px)); z-index: 12; background: var(--ground); margin: -18px calc(-1 * max(16px, env(safe-area-inset-right, 0px))) 0 calc(-1 * max(16px, env(safe-area-inset-left, 0px))); padding: 10px max(16px, env(safe-area-inset-right, 0px)) 8px max(16px, env(safe-area-inset-left, 0px)); border-bottom: 1px solid var(--line); }
.vhead .top { display: flex; align-items: center; gap: 12px; }
.vhead .score { margin-left: auto; text-align: right; }
.vhead .score .fig { font-size: 30px; }
.vhead .score small { display: block; font-size: 11.5px; color: var(--ink-2); margin-top: 2px; }
.progress { height: 4px; border-radius: 2px; background: var(--line); overflow: hidden; margin-top: 10px; }
.progress i { display: block; height: 100%; background: var(--ink); transform-origin: left; transition: transform 220ms var(--ease-out); }
.secs { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; margin: 10px calc(-1 * max(16px, env(safe-area-inset-right, 0px))) 0; padding: 0 max(16px, env(safe-area-inset-right, 0px)) 2px; scroll-snap-type: x proximity; overscroll-behavior-x: contain; }
.secs::-webkit-scrollbar { display: none; }
.sec { flex: 0 0 auto; scroll-snap-align: start; min-height: 40px; padding: 0 12px; border-radius: 20px; border: 1px solid var(--line-2); background: var(--paper); display: inline-flex; align-items: center; gap: 7px; font-size: 13.5px; font-weight: 550; cursor: pointer; transition: background-color 150ms ease; }
.sec .n { font-family: var(--font-fig); font-weight: 700; font-size: 15px; }
.sec .c { font-size: 12px; color: var(--ink-3); font-variant-numeric: tabular-nums; }
.sec.done { border-color: color-mix(in srgb, var(--ok) 40%, var(--line-2)); }
.sec.done .c { color: var(--ok); }
.sec.hasbad .c { color: var(--bad); }
.sec[aria-current="true"] { background: var(--tag); color: var(--tag-ink); border-color: var(--tag); }
.sec[aria-current="true"] .c { color: var(--tag-ink); }

.sechead { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; }
.sechead .basis { font-size: 13px; color: var(--ink-2); margin-top: 3px; }
.timer { font-family: var(--font-fig); font-weight: 600; font-size: 18px; font-variant-numeric: tabular-nums; color: var(--ink-2); white-space: nowrap; }
.timer.over { color: var(--mid); }

.item { background: var(--paper); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; display: flex; flex-direction: column; gap: 12px; transition: border-color 200ms ease; }
.item.v-ok { border-color: color-mix(in srgb, var(--ok) 35%, var(--line)); }
.item.v-fail { border-color: color-mix(in srgb, var(--bad) 55%, var(--line)); }
.item .q { display: flex; gap: 10px; }
.item .q .id { font-family: var(--font-fig); font-weight: 600; font-size: 15px; color: var(--ink-3); flex: 0 0 auto; padding-top: 1px; font-variant-numeric: tabular-nums; min-width: 34px; }
.item .q p { font-size: 15px; line-height: 1.42; }
.crit { display: inline-flex; margin-top: 6px; }
.marks { display: grid; grid-template-columns: 1fr 1fr 0.72fr; gap: 8px; }
.mk { min-height: 52px; border-radius: 10px; border: 1px solid var(--line-2); background: var(--paper); display: flex; align-items: center; justify-content: center; gap: 6px; font-weight: 650; font-size: 15px; cursor: pointer; transition: transform 120ms var(--ease-out), background-color 160ms ease, border-color 160ms ease, color 160ms ease; }
.mk:active { transform: scale(0.96); }
.mk.ok[aria-pressed="true"] { background: var(--ok); border-color: var(--ok); color: #fff; }
.mk.fail[aria-pressed="true"] { background: var(--bad); border-color: var(--bad); color: #fff; }
.mk.na[aria-pressed="true"] { background: var(--ink-3); border-color: var(--ink-3); color: var(--paper); }
.failbox { display: flex; flex-direction: column; gap: 12px; padding-top: 12px; border-top: 1px dashed var(--line-2); }
.photos { display: flex; gap: 8px; flex-wrap: wrap; }
.ph { position: relative; width: 84px; height: 84px; border-radius: 8px; overflow: hidden; background: var(--paper-2); border: 1px solid var(--line); flex: 0 0 auto; }
.ph img { width: 100%; height: 100%; object-fit: cover; display: block; }
.ph button.rm { position: absolute; top: 3px; right: 3px; width: 28px; height: 28px; border-radius: 14px; border: 0; background: rgb(0 0 0 / 0.6); color: #fff; display: grid; place-items: center; cursor: pointer; }
.ph button.open { all: unset; display: block; width: 100%; height: 100%; cursor: zoom-in; }
.addph { width: 84px; height: 84px; border-radius: 8px; border: 1.5px dashed var(--line-2); background: transparent; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 12px; font-weight: 600; color: var(--ink-2); cursor: pointer; position: relative; }
.addph input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
.addph.need { border-color: var(--bad); color: var(--bad); }
.nophoto { width: 84px; height: 84px; border-radius: 8px; border: 1px dashed var(--line-2); display: grid; place-items: center; text-align: center; font-size: 11px; color: var(--ink-3); padding: 6px; background: var(--paper-2); }
.prio { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.prio button { min-height: 52px; border-radius: 10px; border: 1px solid var(--line-2); background: var(--paper); cursor: pointer; display: flex; flex-direction: column; align-items: flex-start; justify-content: center; padding: 6px 10px; gap: 1px; text-align: left; transition: background-color 150ms ease; }
.prio button b { font-size: 14px; } .prio button span { font-size: 11.5px; color: var(--ink-2); line-height: 1.2; }
.prio button[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.prio button[aria-pressed="true"] span { color: color-mix(in srgb, var(--paper) 75%, var(--ink)); }
.stepper { display: flex; align-items: center; gap: 10px; }
.stepper .btn { width: 48px; padding: 0; }

.switch input::after { content: ""; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 11px; background: var(--paper); box-shadow: 0 1px 3px rgb(0 0 0 / 0.25); transition: transform 180ms var(--ease-out); }
.switch input:checked { background: var(--ok); }

.ba { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

  const plural = (n, one, few, many) => { const a = Math.abs(n) % 100, b = a % 10; if (a > 10 && a < 20) return many; if (b > 1 && b < 5) return few; if (b === 1) return one; return many; };
  const daysBetween = (a, b) => Math.round((parseYmd(ymd(b)) - parseYmd(ymd(a))) / DAY);

  const MONTHS_LOC = ["январе", "феврале", "марте", "апреле", "мае", "июне", "июле", "августе", "сентябре", "октябре", "ноябре", "декабре"];

  function rng(seed) { // mulberry32
    let a = 0; for (const ch of String(seed)) a = (a * 31 + ch.charCodeAt(0)) | 0;
    return () => { a |= 0; a = (a + 0x6d2b79f5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
  }

        } catch (e) { res(null); }
      });
      return dbp;
    };
    return {
      async put(id, dataUrl) {
        mem.set(id, dataUrl);
        const db = await open(); if (!db) return;
        await new Promise((res) => { try { const tx = db.transaction("p", "readwrite"); tx.objectStore("p").put(dataUrl, id); tx.oncomplete = tx.onerror = () => res(); } catch (e) { res(); } });
      },
      async get(id) {
        if (mem.has(id)) return mem.get(id);
        const db = await open(); if (!db) return null;
        return new Promise((res) => { try { const r = db.transaction("p").objectStore("p").get(id); r.onsuccess = () => { if (r.result) mem.set(id, r.result); res(r.result || null); }; r.onerror = () => res(null); } catch (e) { res(null); } });
      },
      async del(id) {
        mem.delete(id);
        const db = await open(); if (!db) return;
        try { db.transaction("p", "readwrite").objectStore("p").delete(id); } catch (e) { /* ignore */ }
      },
      async clear() { mem.clear(); const db = await open(); if (!db) return; try { db.transaction("p", "readwrite").objectStore("p").clear(); } catch (e) { /* ignore */ } },
    };
  })();

  // compress + stamp: магазин, дата/время, пункт
  function processPhoto(file, stampLines) {
    return new Promise((resolve, reject) => {
      const url = URL.createObjectURL(file);
      const img = new Image();
      img.onload = () => {
        const max = 1600, k = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
        const w = Math.round(img.naturalWidth * k), h = Math.round(img.naturalHeight * k);
        const c = document.createElement("canvas"); c.width = w; c.height = h;
        const g = c.getContext("2d");
        g.drawImage(img, 0, 0, w, h);
        const fs = Math.max(14, Math.round(w / 38)), pad = Math.round(fs * 0.6), lh = Math.round(fs * 1.3);
        g.font = `600 ${fs}px system-ui, sans-serif`;
        const bw = Math.min(w, Math.max(...stampLines.map((l) => g.measureText(l).width)) + pad * 2), bh = lh * stampLines.length + pad;
        g.fillStyle = "rgba(0,0,0,0.62)"; g.fillRect(0, h - bh, bw, bh);
        g.fillStyle = "#f8bbd9"; g.fillRect(0, h - bh, Math.max(4, Math.round(fs / 4)), bh);
        g.fillStyle = "#fff"; g.textBaseline = "top";
        stampLines.forEach((l, i) => g.fillText(l, pad, h - bh + pad / 2 + i * lh));
        URL.revokeObjectURL(url);
        resolve(c.toDataURL("image/jpeg", 0.8));
      };
      img.onerror = () => { URL.revokeObjectURL(url); reject(new Error("Не удалось открыть фото. Попробуйте снять ещё раз.")); };
      img.src = url;
    });
  }

  /* ------------------------------------------------------------ seed (тестовые данные) */
  function seed() {
    const st = { ver: 1, seeded: true, session: null, visits: [], tasks: [], drafts: {}, reports: [] };
    const t0 = today0();
    for (const store of D.stores) {
      const r = rng("v" + store.id);
      const lastAgo = Math.floor(3 + r() * 50); // 3..52 дня назад
      const ago = [lastAgo, lastAgo + 26 + Math.floor(r() * 10)];
      const quality = 0.88 + r() * 0.11;
      ago.reverse().forEach((daysAgo, idx) => {
        const start = new Date(t0.getTime() - daysAgo * DAY + (9 + Math.floor(r() * 7)) * 3600e3 + Math.floor(r() * 50) * 60e3);
        const params = { vit: r() < 0.6 ? "full" : r() < 0.7 ? "free" : "end", cash2: r() < 0.5 };
        const v = { id: "v" + store.id + "-" + idx, store: store.id, dp: DP_BY_DIV[store.div].login, tpl: TPL.id, status: "signed", seed: true,
          startedAt: start.toISOString(), endedAt: new Date(start.getTime() + (78 + Math.floor(r() * 30)) * 60e3).toISOString(),
          params, answers: {}, summary: { notes: "", recheck: false }, sign: { dmName: "" } };
        for (const it of ALL_ITEMS) {
          if (!applies(it, params)) continue;
          const x = r();
          const pFail = it.crit ? (1 - quality) * 0.15 : 1 - quality;
          const val = x < pFail ? "fail" : x < pFail + 0.025 ? "na" : "ok";
          const a = { v: val };
          if (it.count) a.count = val === "fail" ? 30 : 30 + Math.floor(r() * 12);
          if (val === "fail") {
            a.prio = it.crit ? 1 : r() < 0.4 ? 2 : r() < 0.7 ? 3 : 2;
            a.comment = SEED_COMMENTS[Math.floor(r() * SEED_COMMENTS.length)];
            a.photos = [];
          }
          v.answers[it.id] = a;
        }
        const sc = computeScore(v); Object.assign(v, { score: sc.score, crit: sc.crit, fails: sc.fail });
        v.summary.recheck = sc.crit || sc.score < 80;
        st.visits.push(v);
        // tasks
        for (const [itemId, a] of Object.entries(v.answers)) {
          if (a.v !== "fail") continue;
          const it = ITEM[itemId];
          const due = new Date(start.getTime() + DUE_DAYS[a.prio] * DAY);
          const age = daysBetween(start, t0);
          let status;
          const z = r();
          if (age > 20) status = z < 0.97 ? "accepted" : "open";
          else if (age > 8) status = z < 0.72 ? "accepted" : z < 0.86 ? "review" : z < 0.92 ? "returned" : "open";
          else status = z < 0.2 ? "accepted" : z < 0.45 ? "review" : z < 0.55 ? "returned" : "open";
          const task = { id: "t" + v.id + "-" + itemId, visit: v.id, store: store.id, item: itemId, sec: it.sec, text: it.text, comment: a.comment, photos: [], prio: a.prio,
            due: ymd(due), status, createdAt: v.endedAt, seed: true, fix: null, history: [{ at: v.endedAt, by: v.dp, act: "created" }] };
          if (status !== "open") {
            const fixAt = new Date(Math.min(t0.getTime() + 8 * 3600e3, start.getTime() + (1 + Math.floor(r() * DUE_DAYS[a.prio])) * DAY));
            task.fix = { comment: "Исправлено, фото приложено", photos: [], at: fixAt.toISOString() };
            task.history.push({ at: fixAt.toISOString(), by: "dm" + store.id, act: "fixed", comment: task.fix.comment });
            if (status === "accepted") task.history.push({ at: new Date(fixAt.getTime() + 20 * 3600e3).toISOString(), by: v.dp, act: "accepted" });
            if (status === "returned") task.history.push({ at: new Date(fixAt.getTime() + 20 * 3600e3).toISOString(), by: v.dp, act: "returned", comment: "На фото не видно исправления, переснимите блок целиком" });
          }
          st.tasks.push(task);
        }
      });
    }
    st.reports = seedReports();

  }

      if (e.target.id !== "sq") return;
      const q = e.target.value.trim().toLowerCase(); let n = 0;
      root.querySelectorAll("#storeList [data-search]").forEach((r) => { const hit = !q || r.dataset.search.includes(q); r.hidden = !hit; if (hit) n++; });
      const none = $("#storeNone", root); if (none) none.hidden = n > 0;
    });
  }
  function menu() {
    const u = me();
    sheet(`<div class="row" style="cursor:default;padding-inline:0"><span class="main"><span class="t1"><span class="name">${esc(u.name)}</span></span><span class="t2">${ROLE_NAME[u.role]}${u.div ? " · " + esc(u.div) : ""} · логин ${u.login}</span></span></div>
      <div class="field"><span class="lbl">Тема</span><div class="chips">${[["", "Как в системе"], ["light", "Светлая"], ["dark", "Тёмная"]].map(([k, l]) => `<button class="chip" data-theme-set="${k}" aria-pressed="${(document.documentElement.dataset.theme || "") === k}">${l}</button>`).join("")}</div></div>
      <button class="btn block" data-out>${icon("logout", "sm")}Выйти</button>
      <p class="hint">Версия ${APP_VERSION} · прототип, данные в этом браузере</p>`, (sh, close) => {
      sh.addEventListener("click", (e) => {
        const th = e.target.closest("[data-theme-set]");
        if (th) { const v = th.dataset.themeSet; if (v) document.documentElement.dataset.theme = v; else delete document.documentElement.dataset.theme; try { localStorage.setItem("audit.theme", v); } catch (er) { /* ignore */ } sh.querySelectorAll("[data-theme-set]").forEach((b) => b.setAttribute("aria-pressed", String(b === th))); syncThemeColor(); }
        if (e.target.closest("[data-out]")) { S().session = null; Store.save(); close(); stack.length = 0; route = { name: "home", p: {} }; render(true); }
      });
    });
  }
  function confirmReset() {
    sheet(`<h2>Сбросить тестовые данные?</h2><p class="sub">Удалятся все визиты, задачи, фото и подписи в этом браузере. Тестовые визиты создадутся заново. Отменить нельзя.</p>
      <div style="display:flex;gap:10px"><button class="btn" style="flex:1" data-no>Отмена</button><button class="btn danger" style="flex:1" data-yes>Сбросить</button></div>`, (sh, close) => {
      sh.querySelector("[data-no]").addEventListener("click", close);
      sh.querySelector("[data-yes]").addEventListener("click", async () => { await Store.reset(); close(); toast("Тестовые данные созданы заново"); stack.length = 0; route = { name: "home", p: {} }; render(true); });
    });
  }
  function syncThemeColor() {
    const c = getComputedStyle(document.documentElement).getPropertyValue("--tag").trim();
    document.querySelectorAll('meta[name="theme-color"]').forEach((m) => m.setAttribute("content", c));
  }

  /* ------------------------------------------------------------ boot */
  try { const th = localStorage.getItem("audit.theme"); if (th) document.documentElement.dataset.theme = th; } catch (e) { /* ignore */ }
  Store.init();
  render(false);
  syncThemeColor();
  window.__audit = { Store, computeScore, TPL, ITEM, go, render }; // для проверки в консоли
})();
</script>
</body>
</html>
