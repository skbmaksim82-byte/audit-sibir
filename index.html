        <div class="list" style="margin-top:12px">${TPL.sections.map((s) => `<div class="secrow"><span class="n">${s.n}</span><span>${esc(s.title)} <span class="sub">· ${s.items.length} п. · ${s.min} мин</span></span><span class="sub">${esc(s.basis.split(",")[0])}</span></div>`).join("")}</div></section>
      <section><div class="group-h"><h2>Пользователи</h2><span>${USERS.length}</span></div>
        <div class="list">${[...D.dps, USERS.find((x) => x.login === "sales"), USERS.find((x) => x.login === "region")].map((x) => `<div class="row" style="cursor:default"><span class="main"><span class="t1"><span class="name">${esc(x.name)}</span></span><span class="t2">${x.role === "dp" ? "ДП · " + esc(x.div) : ROLE_NAME[x.role]} · логин ${x.login}</span></span></div>`).join("")}
          <div class="row" style="cursor:default"><span class="main"><span class="t1"><span class="name">${D.stores.length} ${plural(D.stores.length, "директор магазина", "директора магазинов", "директоров магазинов")}</span></span><span class="t2">логины dm + код магазина, например dm${D.stores[0].id}</span></span></div></div>
        <p class="hint">${SRV.on ? "Логины и пароли выдаются на сервере командой manage.py (см. README-DEPLOY.md)." : `Выдача логинов и паролей — на сервере. В прототипе у всех пароль ${PASSWORD}.`}</p></section>
      <section><div class="group-h"><h2>Хранение и уведомления</h2></div>
        <div class="panel"><dl class="kv"><dt>Фото</dt><dd>4 месяца</dd><dt>Сроки по приоритету</dt><dd>П1 ${DUE_DAYS[1]} дн · П2 ${DUE_DAYS[2]} дн · П3 ${DUE_DAYS[3]} дн</dd><dt>Уведомления</dt><dd>push, почта, Kari Connect позже</dd></dl></div></section>
      ${SRV.on ? "" : `<section><div class="group-h"><h2>Тестовые данные</h2></div>
        <div class="panel"><p class="sub">Сбросить все визиты, задачи и фото в этом браузере и создать тестовые данные заново.</p><button class="btn danger" data-act="reset">Сбросить тестовые данные</button></div></section>`}`;
    return { title: "Настройки", sub: ROLE_NAME.sales, body };
  };

  /* ------------------------------------------------------------ render */
  const app = document.getElementById("app");
  // every render builds a fresh root, so listeners never pile up on a long-lived node
  function render(animate) {
    const u = me();
    const root = document.createElement("div");
    if (!u) { root.innerHTML = loginView(); app.replaceChildren(root); bindLogin(root); return; }
    let view;
    try { view = screens[route.name] ? screens[route.name](route.p || {}) : screens.home(); }
    catch (err) { console.error(err); route = { name: "home", p: {} }; stack.length = 0; view = screens.home(); }
    root.innerHTML = shell({ title: view.title, sub: view.sub, body: view.body, action: view.action, tabs: view.tabs !== false });
    app.replaceChildren(root);
    if (animate) { const m = $("#main", root); m && m.classList.add("enter"); window.scrollTo({ top: 0 }); }
    bindCommon(root);
    if (SRV.on) Sync.paint();
    if (route.name === "visit") bindVisit(root, visitById(route.p.id));
    if (route.name === "summary") bindSummary(root, visitById(route.p.id));
    if (route.name === "task") bindTask(root, S().tasks.find((t) => t.id === route.p.id));
    if (route.name === "report" || route.name === "rblock" || route.name === "rstore") bindReport(root);
    if (route.name === "act" && route.p.item && animate) setTimeout(() => { const el = document.getElementById("cl-" + route.p.item.replace(".", "-")); if (el) { el.closest("details").open = true; el.scrollIntoView({ block: "center" }); el.classList.add("flash"); } }, 60);
    hydratePhotos(root);
  }
  function bindCommon(root) {
    root.addEventListener("click", (e) => {
      const t = e.target;
      if (t.closest("[data-devlist]")) return go("devvisits");
      const dok = t.closest("[data-devok]");
      if (dok) { const v = visitById(dok.dataset.devok); if (v) { v.deviceOk = { by: me().login, at: new Date().toISOString() }; Store.save(); toast("Устройство подтверждено"); render(false); } return; }
      if (t.closest("[data-back]")) return back();
      const tab = t.closest("[data-tab]"); if (tab) { stack.length = 0; route = { name: tab.dataset.tab, p: {} }; return render(true); }
      const st = t.closest("[data-store]:not([data-act])"); if (st) return go("store", { id: st.dataset.store });
      const vi = t.closest("[data-visit]"); if (vi) return go("act", { id: vi.dataset.visit });
      const tk = t.closest("[data-task]"); if (tk) return go("task", { id: tk.dataset.task });
      const sd = t.closest("[data-sdiv]"); if (sd) { sDiv = sd.dataset.sdiv; return render(false); }
      const dv2 = t.closest("[data-dpvisits]"); if (dv2) return go("dpvisits", { div: dv2.dataset.dpvisits });
      const cm = t.closest("[data-cmt]"); if (cm) return openComment(cm.dataset.cmt, cm.dataset.cmtStore, cm.dataset.cmtLabel);
      const rvb = t.closest("[data-review]"); if (rvb) return openReview(visitById(rvb.dataset.review));
      const gt = t.closest("[data-goto]"); if (gt) { const l = targetLink({ target: gt.dataset.goto }); if (l) go(l.name, l.p); else toast("Запись не найдена"); return; }
      if (t.closest("[data-goto-list]")) return go("cmts");
      const rs = t.closest("[data-rstore]"); if (rs) return go("rstore", { id: rs.dataset.rstore, week: rs.dataset.rweek });
      const rb = t.closest("[data-rblock]"); if (rb) return go("rblock", { n: Number(rb.dataset.rblock) });
      const rf = t.closest("[data-rfilter]"); if (rf) { rFilter = rFilter === rf.dataset.rfilter && rf.closest(".strip") ? "all" : rf.dataset.rfilter; return render(false); }
      const rd = t.closest("[data-rdiv]"); if (rd) { rDiv = rd.dataset.rdiv; return render(false); }
      const f = t.closest("[data-filter]"); if (f) { dpFilter = dpFilter === f.dataset.filter && f.closest(".strip") ? "all" : f.dataset.filter; return render(false); }
      const tf = t.closest("[data-tfilter]"); if (tf) { taskFilter = tf.dataset.tfilter; return render(false); }
      const rq = t.closest("[data-rpdiv]"); if (rq) { rpDiv = rpDiv === rq.dataset.rpdiv ? "all" : rq.dataset.rpdiv; return render(false); }
      const dv = t.closest("[data-div]"); if (dv) { regionDiv = regionDiv === dv.dataset.div && dv.tagName === "TR" ? "all" : dv.dataset.div; return render(false); }
      const a = t.closest("[data-act]"); if (!a) return;
      if (a.dataset.act === "start") return startVisit(a.dataset.store);
      if (a.dataset.act === "resume") { const d = draftOf(a.dataset.store); return go("visit", { id: d.id }); }
      if (a.dataset.act === "menu") return menu();
      if (a.dataset.act === "reset") return confirmReset();
    });
    root.addEventListener("keydown", (e) => { if (e.key === "Enter" && e.target.matches("tr.click")) e.target.click(); });
    root.addEventListener("change", (e) => {
      const sel = e.target.closest("[data-rpsel]"); if (!sel) return;
      if (sel.dataset.rpsel === "div") rpDiv = sel.value; else rpOff = Number(sel.value) || 0;
      render(false);
    });
    root.addEventListener("input", (e) => {
      if (e.target.id !== "sq") return;
      const q = e.target.value.trim().toLowerCase(); let n = 0;
      root.querySelectorAll("#storeList [data-search]").forEach((r) => { const hit = !q || r.dataset.search.includes(q); r.hidden = !hit; if (hit) n++; });
      const none = $("#storeNone", root); if (none) none.hidden = n > 0;
    });
  }
  function menu() {
    const u = me();
    sheet(`<div class="row" style="cursor:default;padding-inline:0"><span class="main"><span class="t1"><span class="name">${esc(u.name)}</span></span><span class="t2">${ROLE_NAME[u.role]}${u.div ? " · " + esc(u.div) : ""} · логин ${u.login}</span></span></div>
      <div class="field"><span class="lbl">Тема</span><div class="chips">${[["", "Как в системе"], ["light", "Светлая"], ["dark", "Тёмная"]].map(([k, l]) => `<button class="chip" data-theme-set="${k}" aria-pressed="${(document.documentElement.dataset.theme || "") === k}">${l}</button>`).join("")}</div></div>
      <button class="btn block" data-out>${icon("logout", "sm")}Выйти</button>
      <p class="hint">Версия ${APP_VERSION} · ${SRV.on ? "пилот, данные на сервере" : "прототип, данные в этом браузере"}</p>`, (sh, close) => {
      sh.addEventListener("click", (e) => {
        const th = e.target.closest("[data-theme-set]");
        if (th) { const v = th.dataset.themeSet; if (v) document.documentElement.dataset.theme = v; else delete document.documentElement.dataset.theme; try { localStorage.setItem("audit.theme", v); } catch (er) { /* ignore */ } sh.querySelectorAll("[data-theme-set]").forEach((b) => b.setAttribute("aria-pressed", String(b === th))); syncThemeColor(); }
        if (e.target.closest("[data-out]")) {
          close(); stack.length = 0; route = { name: "home", p: {} };
          if (SRV.on) { Sync.stop(); srvFetch("logout", { method: "POST" }).catch(() => {}).finally(async () => { await Store.wipe(); render(true); }); return; }
          S().session = null; Store.save(); render(true);
        }
      });
    });
  }
  function confirmReset() {
    sheet(`<h2>Сбросить тестовые данные?</h2><p class="sub">Удалятся все визиты, задачи, фото и подписи в этом браузере. Тестовые визиты создадутся заново. Отменить нельзя.</p>
      <div style="display:flex;gap:10px"><button class="btn" style="flex:1" data-no>Отмена</button><button class="btn danger" style="flex:1" data-yes>Сбросить</button></div>`, (sh, close) => {
      sh.querySelector("[data-no]").addEventListener("click", close);
      sh.querySelector("[data-yes]").addEventListener("click", async () => { await Store.reset(); close(); toast("Тестовые данные созданы заново"); stack.length = 0; route = { name: "home", p: {} }; render(true); });
    });
  }
  function syncThemeColor() {
    const c = getComputedStyle(document.documentElement).getPropertyValue("--tag").trim();
    document.querySelectorAll('meta[name="theme-color"]').forEach((m) => m.setAttribute("content", c));
  }

  /* ------------------------------------------------------------ boot */
  try { const th = localStorage.getItem("audit.theme"); if (th) document.documentElement.dataset.theme = th; } catch (e) { /* ignore */ }
  async function probeServer() {
    if (!SRV.remote && (location.protocol === "file:" || /github\.io$/.test(location.hostname))) return null;
    const ctl = new AbortController(), tm = setTimeout(() => ctl.abort(), 4000);
    try { const r = await fetch(SRV.base + "health", { cache: "no-store", headers: srvHdr(), signal: ctl.signal }); const j = r.ok ? await r.json() : null; return j && j.app === "audit-sibir" ? j : null; }
    catch (e) { return null; } finally { clearTimeout(tm); }
  }
  function usePilotStores(ids) { // в пилоте видны только магазины, открытые на сервере
    if (!ids || !ids.length || ids.length >= D.stores.length) return;
    const keep = D.stores.filter((x) => ids.includes(x.id)), divs = new Set(keep.map((x) => x.div));
    D.stores.splice(0, D.stores.length, ...keep);
    D.dps.splice(0, D.dps.length, ...D.dps.filter((d) => divs.has(d.div)));
  }
  (async () => {
    // tuna не пропускает запросы с другого адреса (preflight упирается в предупреждение),
    // поэтому с GitHub Pages переходим на адрес сервера: он отдаёт это же приложение.
    if (SRV.remote && location.origin !== SRV.remote) {
      document.body.innerHTML = `<p style="font:16px system-ui;padding:24px">Открываю сервер пилота…</p>`;
      location.replace(SRV.remote + "/"); return;
    }
    let remembered = null; try { remembered = JSON.parse(localStorage.getItem("audit.srv.health") || "null"); } catch (e) { /* ignore */ }
    const h = await probeServer();
    if (h) { h.base = SRV.base; try { localStorage.setItem("audit.srv.health", JSON.stringify(h)); } catch (e) { /* ignore */ } }
    if (remembered && remembered.base && remembered.base !== SRV.base) remembered = null; // сохранено от другого сервера
    // без связи в магазине — работаем с сохранённым; с GitHub Pages и адресом сервера — всегда режим пилота
    const info = h || (remembered && location.protocol !== "file:" ? remembered : null) || (SRV.remote ? { stores: null } : null);
    if (info) { SRV.on = true; SRV.stores = info.stores; usePilotStores(info.stores); if (!h) SRV.status = "offline"; }
    DEVICE = await readDevice();
    Store.init();
    render(false);
    syncThemeColor();
    if (SRV.on && S().session && S().session.token) Sync.start();
  })();
  window.__audit = { Store, computeScore, TPL, ITEM, go, render, get device() { return DEVICE; } }; // для проверки в консоли
})();
</script>
</body>
</html>
