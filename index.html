<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="claude:viewport-fit-sides" content="cover">
<title>Аудит магазина</title>
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#f8bbd9">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#eba9c8">
<meta name="color-scheme" content="light dark">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=Fira+Sans+Extra+Condensed:wght@600;700&display=swap">
<style>/* Аудит магазина — направление «Ценник»: белая бумага ценника, графит, светло-розовая полоса только на оболочке.
   Цифры (баллы, счётчики, сроки) — узкий жирный кегль, десятые подняты как копейки. */
:root {
  --ground: #f1f2f0;
  --paper: #ffffff;
  --paper-2: #f7f8f6;
  --ink: #16181a;
  --ink-2: #4b5156;
  --ink-3: #6b7176;
  --line: #e2e4e1;
  --line-2: #cfd2ce;
  --tag: #f8bbd9;
  --tag-ink: #2d0a1a;
  --ok: #157a3a;
  --ok-tint: #e3f2e8;
  --bad: #c3281d;
  --bad-tint: #fbe7e5;
  --mid: #9c5a00;
  --mid-tint: #fbefdc;
  --na: #6b7176;
  --focus: #1f5fd6;
  --scrim: rgb(22 24 26 / 0.42);
  --shadow-float: 0 8px 28px rgb(22 24 26 / 0.16), 0 2px 6px rgb(22 24 26 / 0.08);

  --font-ui: "Onest", "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
  --font-fig: "Fira Sans Extra Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;

  --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
  --ease-drawer: cubic-bezier(0.32, 0.72, 0, 1);
  --r: 8px;
  --col: 600px;
  --bar-h: 60px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ground: #0f1011; --paper: #18191b; --paper-2: #1e2022; --ink: #eceded; --ink-2: #a9aeb2; --ink-3: #8b9095;
    --line: #2a2d30; --line-2: #3a3e42; --tag: #eba9c8; --tag-ink: #2d0a1a;
    --ok: #4cc27a; --ok-tint: #12301e; --bad: #ff6f62; --bad-tint: #3a1714; --mid: #f0a73a; --mid-tint: #3a2a10; --na: #8b9095;
    --focus: #7aa7ff; --scrim: rgb(0 0 0 / 0.6); --shadow-float: 0 10px 30px rgb(0 0 0 / 0.5);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --ground: #0f1011; --paper: #18191b; --paper-2: #1e2022; --ink: #eceded; --ink-2: #a9aeb2; --ink-3: #8b9095;
  --line: #2a2d30; --line-2: #3a3e42; --tag: #eba9c8; --tag-ink: #2d0a1a;
  --ok: #4cc27a; --ok-tint: #12301e; --bad: #ff6f62; --bad-tint: #3a1714; --mid: #f0a73a; --mid-tint: #3a2a10; --na: #8b9095;
  --focus: #7aa7ff; --scrim: rgb(0 0 0 / 0.6); --shadow-float: 0 10px 30px rgb(0 0 0 / 0.5);
  color-scheme: dark;
}

html { -webkit-tap-highlight-color: transparent; -webkit-text-size-adjust: 100%; overscroll-behavior: none; }
body { background: var(--ground); color: var(--ink); font-family: var(--font-ui); font-size: 15px; line-height: 1.45; margin: 0; }
::selection { background: var(--tag); color: var(--tag-ink); }
* { box-sizing: border-box; }
h1, h2, h3, p { margin: 0; }
h1 { font-size: 22px; line-height: 1.2; font-weight: 700; letter-spacing: -0.01em; text-wrap: balance; }
h2 { font-size: 17px; line-height: 1.25; font-weight: 650; text-wrap: balance; }
h3 { font-size: 15px; font-weight: 600; }
button, input, textarea, select { font: inherit; color: inherit; }
input, textarea, select { font-size: 16px; }
button, a, [role="button"], .chip, .tab { touch-action: manipulation; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: 4px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------- figures: the price-tag numerals ---------- */
.fig { font-family: var(--font-fig); font-weight: 700; font-variant-numeric: tabular-nums lining-nums; line-height: 1; letter-spacing: -0.01em; display: inline-flex; align-items: flex-start; white-space: nowrap; }
.fig .k { font-size: 0.5em; line-height: 1; margin-top: 0.1em; margin-left: 0.04em; }
.fig .u { font-family: var(--font-ui); font-weight: 600; font-size: 0.36em; margin-top: 0.16em; margin-left: 0.18em; color: var(--ink-2); letter-spacing: 0; }
.fig.ok { color: var(--ok); } .fig.mid { color: var(--mid); } .fig.bad { color: var(--bad); } .fig.na { color: var(--ink-3); }
.fig-roll { display: inline-block; }

/* ---------- shell ---------- */
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--tag); }
.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--tag); color: var(--tag-ink); }
.topbar .in { max-width: var(--col); margin: 0 auto; min-height: 52px; display: flex; align-items: center; gap: 10px;
  padding-left: max(12px, env(safe-area-inset-left, 0px)); padding-right: max(12px, env(safe-area-inset-right, 0px)); padding-block: 6px; }
.wide .topbar .in, .wide .page, .wide .tabbar .in { max-width: 1040px; }
.mark { width: 30px; height: 30px; flex: 0 0 auto; display: grid; place-items: center; }
.brand { min-width: 0; flex: 1; display: flex; flex-direction: column; }
.brand b { font-size: 15px; font-weight: 700; line-height: 1.15; }
.brand span { font-size: 12.5px; line-height: 1.2; color: color-mix(in srgb, var(--tag-ink) 78%, var(--tag)); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.iconbtn { width: 44px; height: 44px; display: grid; place-items: center; border: 0; background: transparent; border-radius: 10px; cursor: pointer; color: inherit; flex: 0 0 auto; transition: transform 120ms var(--ease-out), background-color 120ms ease; }
.iconbtn:active { transform: scale(0.94); background: color-mix(in srgb, currentColor 10%, transparent); }
.icon { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: 0 0 auto; }
.icon.sm { width: 18px; height: 18px; }

.page { max-width: var(--col); margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 18px calc(var(--bar-h) + 28px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 20px; }
.page.has-action { padding-bottom: calc(var(--bar-h) + 96px + env(safe-area-inset-bottom, 0px)); }
.page.no-tabs { padding-bottom: calc(110px + env(safe-area-inset-bottom, 0px)); }
.titlerow { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; }
.titlerow p { color: var(--ink-2); font-size: 13.5px; margin-top: 4px; }
.sub { color: var(--ink-2); font-size: 13.5px; }
.back { display: inline-flex; align-items: center; gap: 4px; margin: -6px 0 -8px -10px; padding: 8px 10px; border: 0; background: none; color: var(--ink-2); font-size: 14px; cursor: pointer; border-radius: 8px; min-height: 40px; align-self: flex-start; }
.back:active { background: var(--line); }

.tabbar { position: fixed; inset: auto 0 0; z-index: 20; background: var(--paper); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); }
.tabbar .in { max-width: var(--col); margin: 0 auto; display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); }
.tab { height: var(--bar-h); border: 0; background: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 12px; font-weight: 550; color: var(--ink-3); cursor: pointer; position: relative; }
.tab[aria-current="page"] { color: var(--ink); }
.tab[aria-current="page"]::before { content: ""; position: absolute; top: 0; left: 28%; right: 28%; height: 3px; border-radius: 0 0 3px 3px; background: var(--tag); }
.tab .badge { position: absolute; top: 7px; left: calc(50% + 8px); min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: var(--bad); color: #fff; font-size: 11px; font-weight: 700; display: grid; place-items: center; font-variant-numeric: tabular-nums; }

/* ---------- figure strip (not tiles) ---------- */
.strip { display: grid; grid-template-columns: repeat(3, 1fr); background: var(--paper); border: 1px solid var(--line); border-radius: var(--r); }
.strip > * { padding: 12px 14px 12px; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.strip > * + * { border-left: 1px solid var(--line); }
.strip .fig { font-size: 34px; }
.strip .lbl { font-size: 12.5px; color: var(--ink-2); line-height: 1.25; }
.strip button { appearance: none; border: 0; border-radius: 0; background: none; font: inherit; color: inherit; text-align: left; cursor: pointer; transition: background-color 120ms ease; }
.strip button:active { background: var(--paper-2); }
.strip > :first-child { border-radius: var(--r) 0 0 var(--r); } .strip > :last-child { border-radius: 0 var(--r) var(--r) 0; }
.strip button:focus-visible { outline: 2px solid var(--focus); outline-offset: 4px; }

/* ---------- lists ---------- */
.list { background: var(--paper); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.row { display: flex; align-items: center; gap: 12px; padding: 12px 14px; min-height: 64px; border: 0; background: none; width: 100%; text-align: left; cursor: pointer; transition: background-color 120ms ease; }
.row + .row, .list > * + * { border-top: 1px solid var(--line); }
.row:active { background: var(--paper-2); }
.row .main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.row .t1 { font-weight: 600; display: flex; align-items: baseline; gap: 8px; min-width: 0; }
.row .t1 .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .t2 { font-size: 13px; color: var(--ink-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .end { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; flex: 0 0 auto; }
.row .end .fig { font-size: 28px; }
.code { font-family: var(--font-fig); font-weight: 600; font-size: 16px; letter-spacing: 0.02em; color: var(--ink); font-variant-numeric: tabular-nums; }
.chev { color: var(--ink-3); }
.group-h { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-bottom: 8px; }
.group-h h2 { font-size: 15px; }
.group-h span { font-size: 13px; color: var(--ink-2); }
.empty { padding: 22px 16px; text-align: center; color: var(--ink-2); font-size: 14px; background: var(--paper); border: 1px dashed var(--line-2); border-radius: var(--r); }
.empty b { display: block; color: var(--ink); margin-bottom: 4px; font-size: 15px; }

.pill { display: inline-flex; align-items: center; gap: 4px; height: 22px; padding: 0 8px; border-radius: 11px; font-size: 12px; font-weight: 600; white-space: nowrap; background: var(--line); color: var(--ink-2); }
.pill.ok { background: var(--ok-tint); color: var(--ok); } .pill.bad { background: var(--bad-tint); color: var(--bad); } .pill.mid { background: var(--mid-tint); color: var(--mid); }
.pill.p1 { background: var(--bad-tint); color: var(--bad); } .pill.p2 { background: var(--mid-tint); color: var(--mid); } .pill.p3 { background: var(--line); color: var(--ink-2); }
.pill.wait { background: transparent; box-shadow: inset 0 0 0 1px var(--ink); color: var(--ink); }
.pill.demo { background: transparent; border: 1px dashed var(--line-2); color: var(--ink-3); font-weight: 500; }

/* ---------- segmented / chips ---------- */
.seg { display: flex; gap: 4px; padding: 3px; background: var(--paper); border: 1px solid var(--line); border-radius: 10px; overflow-x: auto; scrollbar-width: none; }
.seg::-webkit-scrollbar { display: none; }
.seg button { flex: 1 0 auto; min-height: 38px; padding: 0 12px; border: 0; border-radius: 7px; background: transparent; font-size: 14px; font-weight: 550; color: var(--ink-2); cursor: pointer; white-space: nowrap; transition: background-color 150ms ease, color 150ms ease; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { min-height: 40px; padding: 0 14px; border: 1px solid var(--line-2); border-radius: 20px; background: var(--paper); font-size: 14px; font-weight: 550; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; transition: transform 120ms var(--ease-out), background-color 150ms ease, border-color 150ms ease; }
.chip:active { transform: scale(0.97); }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }

/* ---------- buttons ---------- */
.btn { min-height: 48px; padding: 0 18px; border-radius: 10px; border: 1px solid var(--line-2); background: var(--paper); font-weight: 650; font-size: 15px; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 8px; transition: transform 140ms var(--ease-out), background-color 150ms ease, opacity 150ms ease; }
.btn:active { transform: scale(0.97); }
.btn.primary { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.btn.good { background: var(--ok); border-color: var(--ok); color: #fff; }
.btn.danger { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 45%, var(--line-2)); }
.btn.block { width: 100%; }
.btn:disabled { opacity: 0.45; cursor: not-allowed; transform: none; }
.btn.small { min-height: 40px; padding: 0 14px; font-size: 14px; }
.linkbtn { border: 0; background: none; padding: 6px 0; color: var(--ink); font-weight: 600; text-decoration: underline; text-underline-offset: 3px; text-decoration-color: var(--line-2); cursor: pointer; font-size: 14px; }

.actionbar { position: fixed; inset: auto 0 calc(var(--bar-h) + env(safe-area-inset-bottom, 0px)); z-index: 15; background: color-mix(in srgb, var(--ground) 92%, transparent); border-top: 1px solid var(--line); }
.no-tabs .actionbar { bottom: 0; padding-bottom: env(safe-area-inset-bottom, 0px); }
.actionbar .in { max-width: var(--col); margin: 0 auto; padding: 10px max(16px, env(safe-area-inset-right, 0px)) 10px max(16px, env(safe-area-inset-left, 0px)); display: flex; gap: 10px; align-items: center; }
.actionbar .in > .btn { flex: 1; }
.actionbar .meta { font-size: 13px; color: var(--ink-2); flex: 0 1 auto; min-width: 0; }

/* ---------- panels ---------- */
.panel { background: var(--paper); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; display: flex; flex-direction: column; gap: 12px; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; font-size: 14px; }
.kv dt { color: var(--ink-2); } .kv dd { margin: 0; text-align: right; font-weight: 550; }
.field { display: flex; flex-direction: column; gap: 6px; }
.field label, .field .lbl { font-size: 13px; color: var(--ink-2); font-weight: 550; }
.input, textarea.input { width: 100%; min-height: 48px; padding: 12px 14px; border: 1px solid var(--line-2); border-radius: 10px; background: var(--paper); transition: border-color 150ms ease; }
textarea.input { min-height: 84px; resize: vertical; line-height: 1.4; }
.input:focus { outline: none; border-color: var(--ink); box-shadow: 0 0 0 3px color-mix(in srgb, var(--focus) 25%, transparent); }
.hint { font-size: 12.5px; color: var(--ink-3); }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
.duerow { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); gap: 8px; }
.duerow .input { font-variant-numeric: tabular-nums; -webkit-appearance: none; appearance: none; min-width: 0; }
.dev { display: flex; flex-direction: column; gap: 10px; }
.dev .dev-h { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.dev .dev-h h2 { margin: 0; }
.dev .dev-model { font-family: var(--font-fig); font-weight: 600; font-size: 18px; font-variant-numeric: tabular-nums; }
.devtag { font-family: var(--font-fig); font-size: 12.5px; color: var(--ink-3); font-variant-numeric: tabular-nums; }
.err { font-size: 13px; color: var(--bad); font-weight: 550; }

/* ---------- visit runner ---------- */
.vhead { position: sticky; top: calc(52px + env(safe-area-inset-top, 0px)); z-index: 12; background: var(--ground); margin: -18px calc(-1 * max(16px, env(safe-area-inset-right, 0px))) 0 calc(-1 * max(16px, env(safe-area-inset-left, 0px))); padding: 10px max(16px, env(safe-area-inset-right, 0px)) 8px max(16px, env(safe-area-inset-left, 0px)); border-bottom: 1px solid var(--line); }
.vhead .top { display: flex; align-items: center; gap: 12px; }
.vhead .score { margin-left: auto; text-align: right; }
.vhead .score .fig { font-size: 30px; }
.vhead .score small { display: block; font-size: 11.5px; color: var(--ink-2); margin-top: 2px; }
.progress { height: 4px; border-radius: 2px; background: var(--line); overflow: hidden; margin-top: 10px; }
.progress i { display: block; height: 100%; background: var(--ink); transform-origin: left; transition: transform 220ms var(--ease-out); }
.secs { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; margin: 10px calc(-1 * max(16px, env(safe-area-inset-right, 0px))) 0; padding: 0 max(16px, env(safe-area-inset-right, 0px)) 2px; scroll-snap-type: x proximity; overscroll-behavior-x: contain; }
.secs::-webkit-scrollbar { display: none; }
.sec { flex: 0 0 auto; scroll-snap-align: start; min-height: 40px; padding: 0 12px; border-radius: 20px; border: 1px solid var(--line-2); background: var(--paper); display: inline-flex; align-items: center; gap: 7px; font-size: 13.5px; font-weight: 550; cursor: pointer; transition: background-color 150ms ease; }
.sec .n { font-family: var(--font-fig); font-weight: 700; font-size: 15px; }
.sec .c { font-size: 12px; color: var(--ink-3); font-variant-numeric: tabular-nums; }
.sec.done { border-color: color-mix(in srgb, var(--ok) 40%, var(--line-2)); }
.sec.done .c { color: var(--ok); }
.sec.hasbad .c { color: var(--bad); }
.sec[aria-current="true"] { background: var(--tag); color: var(--tag-ink); border-color: var(--tag); }
.sec[aria-current="true"] .c { color: var(--tag-ink); }

.sechead { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; }
.sechead .basis { font-size: 13px; color: var(--ink-2); margin-top: 3px; }
.timer { font-family: var(--font-fig); font-weight: 600; font-size: 18px; font-variant-numeric: tabular-nums; color: var(--ink-2); white-space: nowrap; }
.timer.over { color: var(--mid); }

.item { background: var(--paper); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; display: flex; flex-direction: column; gap: 12px; transition: border-color 200ms ease; }
.item.v-ok { border-color: color-mix(in srgb, var(--ok) 35%, var(--line)); }
.item.v-fail { border-color: color-mix(in srgb, var(--bad) 55%, var(--line)); }
.item .q { display: flex; gap: 10px; }
.item .q .id { font-family: var(--font-fig); font-weight: 600; font-size: 15px; color: var(--ink-3); flex: 0 0 auto; padding-top: 1px; font-variant-numeric: tabular-nums; min-width: 34px; }
.item .q p { font-size: 15px; line-height: 1.42; }
.crit { display: inline-flex; margin-top: 6px; }
.marks { display: grid; grid-template-columns: 1fr 1fr 0.72fr; gap: 8px; }
.mk { min-height: 52px; border-radius: 10px; border: 1px solid var(--line-2); background: var(--paper); display: flex; align-items: center; justify-content: center; gap: 6px; font-weight: 650; font-size: 15px; cursor: pointer; transition: transform 120ms var(--ease-out), background-color 160ms ease, border-color 160ms ease, color 160ms ease; }
.mk:active { transform: scale(0.96); }
.mk.ok[aria-pressed="true"] { background: var(--ok); border-color: var(--ok); color: #fff; }
.mk.fail[aria-pressed="true"] { background: var(--bad); border-color: var(--bad); color: #fff; }
.mk.na[aria-pressed="true"] { background: var(--ink-3); border-color: var(--ink-3); color: var(--paper); }
.failbox { display: flex; flex-direction: column; gap: 12px; padding-top: 12px; border-top: 1px dashed var(--line-2); }
.photos { display: flex; gap: 8px; flex-wrap: wrap; }
.ph { position: relative; width: 84px; height: 84px; border-radius: 8px; overflow: hidden; background: var(--paper-2); border: 1px solid var(--line); flex: 0 0 auto; }
.ph img { width: 100%; height: 100%; object-fit: cover; display: block; }
.ph button.rm { position: absolute; top: 3px; right: 3px; width: 28px; height: 28px; border-radius: 14px; border: 0; background: rgb(0 0 0 / 0.6); color: #fff; display: grid; place-items: center; cursor: pointer; }
.ph button.open { all: unset; display: block; width: 100%; height: 100%; cursor: zoom-in; }
.addph { width: 84px; height: 84px; border-radius: 8px; border: 1.5px dashed var(--line-2); background: transparent; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 12px; font-weight: 600; color: var(--ink-2); cursor: pointer; position: relative; }
.addph input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
.addph.need { border-color: var(--bad); color: var(--bad); }
.nophoto { width: 84px; height: 84px; border-radius: 8px; border: 1px dashed var(--line-2); display: grid; place-items: center; text-align: center; font-size: 11px; color: var(--ink-3); padding: 6px; background: var(--paper-2); }
.prio { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.prio button { min-height: 52px; border-radius: 10px; border: 1px solid var(--line-2); background: var(--paper); cursor: pointer; display: flex; flex-direction: column; align-items: flex-start; justify-content: center; padding: 6px 10px; gap: 1px; text-align: left; transition: background-color 150ms ease; }
.prio button b { font-size: 14px; } .prio button span { font-size: 11.5px; color: var(--ink-2); line-height: 1.2; }
.prio button[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.prio button[aria-pressed="true"] span { color: color-mix(in srgb, var(--paper) 75%, var(--ink)); }
.stepper { display: flex; align-items: center; gap: 10px; }

.stepper .input { width: 96px; text-align: center; font-family: var(--font-fig); font-weight: 700; font-size: 22px; }

/* ---------- summary / act ---------- */
.verdict { background: var(--paper); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; display: grid; grid-template-columns: auto 1fr; gap: 6px 18px; align-items: end; }

.verdict p { grid-column: 1 / -1; font-size: 13.5px; color: var(--ink-2); padding-top: 8px; border-top: 1px solid var(--line); margin-top: 6px; }
.secrow { display: grid; grid-template-columns: 30px 1fr auto; align-items: center; gap: 10px; padding: 10px 14px; min-height: 48px; }
.secrow .n { font-family: var(--font-fig); font-weight: 700; color: var(--ink-3); }
.secrow .fig { font-size: 20px; }
.secrow .bad { color: var(--bad); font-size: 12.5px; font-weight: 600; }
.sigpad { position: relative; border: 1px solid var(--line-2); border-radius: 10px; background: var(--paper); height: 150px; touch-action: none; overflow: hidden; }
.sigpad canvas { width: 100%; height: 100%; display: block; }
.sigpad .ph-t { position: absolute; left: 14px; bottom: 12px; font-size: 13px; color: var(--ink-3); pointer-events: none; }
.sigpad .base { position: absolute; left: 14px; right: 14px; bottom: 36px; border-top: 1px dashed var(--line-2); pointer-events: none; }
.sigpad .clr { position: absolute; top: 6px; right: 6px; }
.sigimg { height: 64px; width: auto; max-width: 100%; display: block; }
.switch { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 48px; cursor: pointer; }
.switch input { appearance: none; width: 48px; height: 28px; border-radius: 14px; background: var(--line-2); position: relative; cursor: pointer; transition: background-color 180ms ease; flex: 0 0 auto; }
.switch input::after { content: ""; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 11px; background: var(--paper); box-shadow: 0 1px 3px rgb(0 0 0 / 0.25); transition: transform 180ms var(--ease-out); }
.switch input:checked { background: var(--ok); }
.switch input:checked::after { transform: translateX(20px); }

.ba { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.ba figure { margin: 0; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.ba figcaption { font-size: 12.5px; color: var(--ink-2); font-weight: 600; }
.ba .frame { aspect-ratio: 3 / 4; border-radius: 8px; overflow: hidden; background: var(--paper-2); border: 1px solid var(--line); display: grid; place-items: center; text-align: center; font-size: 12px; color: var(--ink-3); padding: 0; max-width: 100%; }
.ba .frame img { width: 100%; height: 100%; object-fit: cover; display: block; }
.ba .frame button { all: unset; width: 100%; height: 100%; cursor: zoom-in; }
.timeline { display: flex; flex-direction: column; gap: 0; }
.timeline li { list-style: none; display: grid; grid-template-columns: 14px 1fr; gap: 10px; padding-bottom: 12px; position: relative; font-size: 13.5px; }
.timeline li::before { content: ""; width: 9px; height: 9px; border-radius: 5px; background: var(--line-2); margin-top: 5px; }
.timeline li::after { content: ""; position: absolute; left: 4px; top: 16px; bottom: 0; width: 1px; background: var(--line); }
.timeline li:last-child::after { display: none; }
.timeline li span { color: var(--ink-2); }
.timeline ol { margin: 0; padding: 0; }

/* ---------- region table ---------- */
.tablewrap { background: var(--paper); border: 1px solid var(--line); border-radius: var(--r); overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th { text-align: left; font-weight: 550; font-size: 12.5px; color: var(--ink-2); padding: 10px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 10px 12px; border-bottom: 1px solid var(--line); vertical-align: middle; }
tr:last-child td { border-bottom: 0; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
td .fig { font-size: 20px; }
tbody tr.click { cursor: pointer; }
@media (hover: hover) and (pointer: fine) {
  tbody tr.click:hover { background: var(--paper-2); }
  .row:hover { background: var(--paper-2); }
  .btn:hover { background: var(--paper-2); }
  .btn.primary:hover { background: color-mix(in srgb, var(--ink) 88%, var(--paper)); }
  .btn.good:hover { background: color-mix(in srgb, var(--ok) 90%, #000); }
  .chip:hover, .sec:hover, .mk:hover { border-color: var(--ink-3); }
  .iconbtn:hover { background: color-mix(in srgb, currentColor 8%, transparent); }
  .linkbtn:hover { text-decoration-color: var(--ink); }
}

.div-list { display: none; }
@media (max-width: 640px) { .div-table { display: none; } .div-list { display: block; } }

/* ---------- sheet & lightbox ---------- */
.scrim { position: fixed; inset: 0; z-index: 40; background: var(--scrim); opacity: 1; transition: opacity 220ms ease; }
.scrim[data-state="closed"] { opacity: 0; }
.sheet { position: fixed; z-index: 41; inset: auto 0 0; max-width: var(--col); margin: 0 auto; background: var(--paper); border-radius: 16px 16px 0 0; box-shadow: var(--shadow-float); padding: 8px max(16px, env(safe-area-inset-right, 0px)) calc(18px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); max-height: 88dvh; overflow-y: auto; overscroll-behavior: contain; transform: translateY(0); transition: transform 320ms var(--ease-drawer); display: flex; flex-direction: column; gap: 14px; }
.sheet[data-state="closed"] { transform: translateY(100%); }
.sheet .grab { width: 40px; height: 4px; border-radius: 2px; background: var(--line-2); margin: 4px auto 2px; }
.lightbox { position: fixed; inset: 0; z-index: 50; background: rgb(0 0 0 / 0.92); display: grid; place-items: center; padding: max(16px, env(safe-area-inset-top, 0px)) 12px max(16px, env(safe-area-inset-bottom, 0px)); opacity: 1; transition: opacity 200ms ease; }
.lightbox[data-state="closed"] { opacity: 0; }
.lightbox img { max-width: 100%; max-height: 100%; border-radius: 6px; }
.lightbox button { position: absolute; top: calc(10px + env(safe-area-inset-top, 0px)); right: 10px; color: #fff; }
.toast { pointer-events: none; position: fixed; z-index: 60; left: 50%; bottom: calc(var(--bar-h) + 20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--paper); padding: 12px 16px; border-radius: 10px; font-size: 14px; font-weight: 550; box-shadow: var(--shadow-float); max-width: calc(100vw - 32px); transition: transform 240ms var(--ease-out), opacity 240ms var(--ease-out); }
.toast[data-state="closed"] { opacity: 0; transform: translate(-50%, 12px); }

/* ---------- login ---------- */
.login { min-height: 100dvh; display: flex; flex-direction: column; }
.login .hero { background: var(--tag); color: var(--tag-ink); padding: calc(28px + env(safe-area-inset-top, 0px)) max(20px, env(safe-area-inset-right, 0px)) 22px max(20px, env(safe-area-inset-left, 0px)); }
.login .hero .in { max-width: 420px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
.login .hero h1 { font-size: 26px; }
.login .hero p { font-size: 14px; max-width: 34ch; }
.login form, .login .demo { max-width: 420px; width: 100%; margin: 0 auto; padding: 20px max(20px, env(safe-area-inset-right, 0px)) 0 max(20px, env(safe-area-inset-left, 0px)); display: flex; flex-direction: column; gap: 14px; }
.login .demo { padding-bottom: calc(32px + env(safe-area-inset-bottom, 0px)); }
.login .demo h2 { font-size: 14px; color: var(--ink-2); font-weight: 600; }
.login .demo .row { min-height: 56px; }
.banner { font-size: 12.5px; color: var(--ink-2); display: flex; gap: 8px; align-items: flex-start; }

.enter { animation: enter 260ms var(--ease-out) both; }
@keyframes enter { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

@media (min-width: 900px) {
  .wide .strip .fig { font-size: 38px; }
}
@media (max-width: 380px) {
  .strip .fig { font-size: 28px; }
  .marks { grid-template-columns: 1fr 1fr 0.8fr; }
  .verdict .fig { font-size: 34px; }
}
@media (prefers-reduced-motion: reduce) {
  .enter { animation: fade 160ms ease both; }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
  .sheet { transition: none; }
  .progress i, .switch input::after { transition: none; }
}

/* ---------- фотоотчёт по блокам ---------- */
.rrev { display: flex; gap: 8px; margin-top: 12px; }
.rrev .btn { flex: 1; min-height: 44px; }
.rrev .btn[aria-pressed="true"] { box-shadow: inset 0 0 0 2px currentColor; }

/* ---------- статистика посещений ДП (директора) ---------- */
.dpgrid { display: grid; gap: 12px; grid-template-columns: 1fr; }

@media (min-width: 1280px) { .dpgrid { grid-template-columns: repeat(3, 1fr); } }
.dphead { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
.dphead h3 { margin: 0; font-size: 17px; }
.dpfig { text-align: right; display: flex; flex-wrap: wrap; justify-content: flex-end; align-items: baseline; }
.dpfig small { flex-basis: 100%; font-size: 12.5px; color: var(--ink-3); margin-top: 4px; }
.wkbars { display: flex; align-items: flex-end; gap: 6px; height: 64px; margin-top: 8px; }
.wk { flex: 1; height: 100%; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; gap: 3px; }
.wk i { display: block; width: 100%; background: var(--ink); border-radius: 3px 3px 0 0; opacity: 0.85; }
.wk b { font-family: var(--font-fig); font-size: 13px; font-weight: 600; color: var(--ink-2); line-height: 1; }

/* ---------- проверка руководителей, комментарии, синхронизация ---------- */
.syncpill { flex: 0 1 auto; min-width: 0; max-width: 46%; height: 26px; padding: 0 10px; border-radius: 13px; font-size: 12px; font-weight: 600; display: inline-flex; align-items: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; background: color-mix(in srgb, var(--tag-ink) 10%, transparent); color: var(--tag-ink); }
.syncpill.offline, .syncpill.error { background: var(--paper); color: var(--bad); }
.thread { display: flex; flex-direction: column; gap: 8px; }
.cmt { background: var(--paper-2); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; font-size: 14px; }
.cmt.r-sales, .cmt.r-region { background: color-mix(in srgb, var(--tag) 28%, var(--paper)); border-color: color-mix(in srgb, var(--tag) 70%, var(--line)); }
.cmt .cm-h { display: flex; justify-content: space-between; gap: 8px; font-size: 12.5px; color: var(--ink-2); margin-bottom: 2px; }
.cmt .cm-h b { color: var(--ink); }
.cmt p { white-space: pre-wrap; overflow-wrap: anywhere; }
.cmtbtn { align-self: flex-start; display: inline-flex; align-items: center; gap: 6px; min-height: 36px; padding: 0 12px; border-radius: 18px; border: 1px solid var(--line-2); background: var(--paper); font-size: 13px; font-weight: 600; color: var(--ink-2); cursor: pointer; transition: transform 120ms var(--ease-out), border-color 150ms ease; }
.cmtbtn:active { transform: scale(0.97); }
.rvrow { display: flex; flex-direction: column; gap: 4px; padding: 10px 0; border-top: 1px solid var(--line); }
.rv-h { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.rv-h b { margin-right: auto; font-size: 14px; }
.rv-s { font-size: 13px; color: var(--ink-2); font-weight: 600; }
.rvrow p { white-space: pre-wrap; }
.stars { display: inline-flex; gap: 3px; }
.stars i { width: 14px; height: 14px; border-radius: 3px; background: var(--line); }
.stars i.on { background: var(--ok); }
.score5 { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
.score5 button { min-height: 60px; border-radius: 10px; border: 1px solid var(--line-2); background: var(--paper); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; cursor: pointer; transition: background-color 150ms ease, transform 120ms var(--ease-out); }
.score5 button:active { transform: scale(0.96); }
.score5 button b { font-family: var(--font-fig); font-size: 22px; line-height: 1; }
.score5 button span { font-size: 10.5px; color: var(--ink-2); line-height: 1.15; text-align: center; }
.score5 button[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.score5 button[aria-pressed="true"] span { color: color-mix(in srgb, var(--paper) 75%, var(--ink)); }
.cl-list { overflow: visible; }
.cl + .cl { border-top: 1px solid var(--line); }
.cl summary { display: flex; align-items: center; gap: 10px; min-height: 52px; padding: 10px 14px; cursor: pointer; list-style: none; }
.cl summary::-webkit-details-marker { display: none; }
.cl summary .cl-t { flex: 1; min-width: 0; font-weight: 600; }
.cl summary .fig { font-size: 20px; }
.cl summary .pill .icon { width: 14px; height: 14px; }
.cl[open] summary { border-bottom: 1px solid var(--line); background: var(--paper-2); }
.cl-i { padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; }
.cl-i + .cl-i { border-top: 1px dashed var(--line); }
.cl-i.is-fail { background: color-mix(in srgb, var(--bad-tint) 45%, transparent); }
.cl-i.flash { animation: flash 1.2s var(--ease-out); }
@keyframes flash { from { background: color-mix(in srgb, var(--tag) 60%, transparent); } }
.cl-q { display: grid; grid-template-columns: 38px 1fr auto; gap: 8px; align-items: start; font-size: 14px; }
.cl-q .code { font-size: 14px; color: var(--ink-3); }
.cl-f { display: flex; flex-direction: column; gap: 6px; padding-left: 46px; font-size: 14px; }
.cl-i .thread { padding-left: 46px; }
@media (max-width: 380px) { .cl-f, .cl-i .thread { padding-left: 0; } }
@media (hover: hover) and (pointer: fine) { .cmtbtn:hover { border-color: var(--ink-3); color: var(--ink); } .score5 button:hover { border-color: var(--ink-3); } }
@media (prefers-reduced-motion: reduce) { .cl-i.flash { animation: none; } }

/* ---------- сводный отчёт директоров: белые карточки на сером поле, шкала зелёный → жёлтый → оранжевый ---------- */
:root {
  --rp-ground: #eceef1; --rp-card: #ffffff; --rp-track: #eef0f2; --rp-gray: #c3c7cb;
  --rp-g: #8cc63f; --rp-l: #cfd63a; --rp-y: #f6c33b; --rp-o: #f39a2e; --rp-r: #e8582a;
  --rp-up: #2e8f47; --rp-down: #d8432b; --rp-day-ink: #3a2408;
  --rp-shadow: 0 1px 2px rgb(22 24 26 / 0.04), 0 8px 24px rgb(22 24 26 / 0.06);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --rp-ground: #0f1011; --rp-card: #18191b; --rp-track: #26292c; --rp-gray: #4a4f54; --rp-up: #5ccf7e; --rp-down: #ff7a62; --rp-shadow: 0 1px 2px rgb(0 0 0 / 0.4), 0 8px 24px rgb(0 0 0 / 0.25); }
}
:root[data-theme="dark"] { --rp-ground: #0f1011; --rp-card: #18191b; --rp-track: #26292c; --rp-gray: #4a4f54; --rp-up: #5ccf7e; --rp-down: #ff7a62; --rp-shadow: 0 1px 2px rgb(0 0 0 / 0.4), 0 8px 24px rgb(0 0 0 / 0.25); }

body.xwide { background: var(--rp-ground); }
.xwide .topbar .in, .xwide .page, .xwide .tabbar .in { max-width: 1320px; }
.tabbar .in:has(.tab:nth-child(6)) .tab { font-size: 11px; }

.rp-head { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px 16px; }
.rp-head p { color: var(--ink-2); font-size: 13.5px; margin-top: 4px; }
.rp-picks { display: flex; gap: 8px; flex-wrap: wrap; }
.rp-pick { position: relative; display: inline-flex; align-items: center; gap: 6px; min-height: 40px; padding: 0 36px 0 14px; border-radius: 20px; background: var(--rp-card); box-shadow: var(--rp-shadow); font-size: 13px; color: var(--ink-3); cursor: pointer; transition: box-shadow 150ms ease; }
.rp-pick b { color: var(--ink); font-weight: 650; font-size: 14px; white-space: nowrap; }
.rp-pick .icon { position: absolute; right: 12px; width: 16px; height: 16px; color: var(--ink-2); pointer-events: none; }
.rp-pick select { position: absolute; inset: 0; width: 100%; opacity: 0; cursor: pointer; font-size: 16px; }
.rp-pick:focus-within { outline: 2px solid var(--focus); outline-offset: 2px; }

.rp-grid { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 14px; }
.rp-card { background: var(--rp-card); border-radius: 20px; box-shadow: var(--rp-shadow); padding: 16px 18px 18px; min-width: 0; display: flex; flex-direction: column; gap: 10px; }
.rp-card > header { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
.rp-card h3 { font-size: 14.5px; font-weight: 650; line-height: 1.25; }
.rp-sub { font-size: 12px; color: var(--ink-3); margin-top: 2px; line-height: 1.3; }
.rp-tag { height: 22px; padding: 0 8px; border-radius: 11px; background: var(--rp-track); color: var(--ink-2); font-size: 11px; font-weight: 650; display: inline-flex; align-items: center; white-space: nowrap; flex: 0 0 auto; }
.rp-tag b { color: var(--ink); margin: 0 3px; }
.rp-num { font-weight: 700; font-size: 34px; line-height: 1; letter-spacing: -0.025em; font-variant-numeric: tabular-nums; white-space: nowrap; }
.rp-num small { font-size: 0.5em; font-weight: 600; margin-left: 3px; letter-spacing: 0; color: var(--ink-2); }
.rp-note { font-size: 12.5px; color: var(--ink-3); }
.rp-note.up { color: var(--rp-up); font-weight: 600; } .rp-note.down { color: var(--rp-down); font-weight: 600; }
.rp-cap { font-size: 11.5px; color: var(--ink-3); }
.rp-meter { position: relative; height: 8px; border-radius: 4px; background: var(--rp-track); margin-top: auto; }
.rp-meter i { position: absolute; inset: 0 auto 0 0; border-radius: 4px; background: linear-gradient(90deg, var(--rp-g), var(--rp-y) 55%, var(--rp-o)); transform-origin: left; }
.rp-meter b { position: absolute; top: -4px; bottom: -4px; width: 2px; margin-left: -1px; border-radius: 1px; background: var(--ink); }
.rp-spark { width: 100%; height: 44px; display: block; margin-top: auto; overflow: visible; }
.rp-line { fill: none; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; vector-effect: non-scaling-stroke; }

.rp-kpi { grid-column: span 2; }
.rp-due { grid-column: span 4; }
.rp-half { grid-column: span 6; }

/* задачи: стопка цифр + столбцы сроков */
.rp-due-in { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 18px; align-items: end; flex: 1; }
.rp-stack { margin: 0; }
.rp-stack dt { font-size: 11.5px; color: var(--ink-3); }
.rp-stack dd { margin: 1px 0 9px; font-weight: 700; font-size: 19px; line-height: 1.1; font-variant-numeric: tabular-nums; white-space: nowrap; }
.rp-stack dd:last-child { margin-bottom: 0; }
.rp-stack dd em { font-style: normal; font-size: 12px; color: var(--rp-down); font-weight: 650; margin-left: 4px; }
.rp-bars { display: flex; gap: 8px; height: 124px; }
.rp-bar { flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: center; gap: 5px; }
.rp-bar .col { flex: 1; width: 100%; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; gap: 4px; }
.rp-bar s { text-decoration: none; font-size: 11px; font-weight: 700; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.rp-bar i { display: block; width: 100%; max-width: 26px; min-height: 4px; border-radius: 7px 7px 4px 4px; background: linear-gradient(to top, var(--rp-l), var(--rp-y) 45%, var(--rp-o)); transform-origin: bottom; }
.rp-bar.hot i { background: linear-gradient(to top, var(--rp-y), var(--rp-o) 50%, var(--rp-r)); }
.rp-bar.zero i { background: var(--rp-track); }
.rp-bar b { font-size: 11px; color: var(--ink-3); font-weight: 600; font-variant-numeric: tabular-nums; }

/* тепловая карта визитов */
.rp-heat-in { display: grid; grid-template-columns: minmax(0, 1fr) 210px; gap: 20px; }
.rp-cal { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; align-content: start; }
.rp-cal .dow { font-size: 11px; color: var(--ink-3); text-align: center; }
.rp-day { aspect-ratio: 1.3; border-radius: 8px; background: var(--c, var(--rp-track)); color: var(--rp-day-ink); padding: 4px 6px; display: flex; flex-direction: column; justify-content: space-between; min-width: 0; }
.rp-day span { font-size: 10.5px; font-weight: 600; opacity: 0.72; line-height: 1; }
.rp-day b { align-self: flex-end; font-size: 13px; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; }
.rp-day.dark { color: #fff; }
.rp-day.none { color: var(--ink-3); }
.rp-day.future { background: transparent; box-shadow: inset 0 0 0 1px var(--rp-track); color: var(--ink-3); }
.rp-pair { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 0; }
.rp-pair dt { font-size: 11.5px; color: var(--ink-3); }
.rp-pair dd { margin: 2px 0 0; font-size: 26px; font-weight: 700; letter-spacing: -0.02em; line-height: 1; font-variant-numeric: tabular-nums; }
.rp-aside { display: flex; flex-direction: column; gap: 10px; }
.rp-aside .rp-meter { margin-top: 4px; }
.rp-drow { display: grid; grid-template-columns: 1fr auto; gap: 5px 8px; font-size: 13px; font-weight: 600; padding-top: 6px; border: 0; background: none; width: 100%; text-align: left; cursor: pointer; border-radius: 6px; }
.rp-drow em { font-style: normal; font-variant-numeric: tabular-nums; }
.rp-drow em.bad { color: var(--rp-down); }
.rp-drow i, .rp-share i { grid-column: 1 / -1; height: 3px; border-radius: 2px; background: var(--rp-track); position: relative; overflow: hidden; display: block; }
.rp-drow i::after, .rp-share i::after { content: ""; position: absolute; inset: 0 auto 0 0; width: var(--w); background: var(--c); border-radius: 2px; transform-origin: left; }
.rp-drow[aria-pressed="true"] { color: var(--ink); }
.rp-drow[aria-pressed="true"] span { text-decoration: underline; text-decoration-color: var(--rp-o); text-decoration-thickness: 2px; text-underline-offset: 3px; }
.rp-legend { display: flex; gap: 10px; flex-wrap: nowrap; white-space: nowrap; align-items: center; font-size: 11px; color: var(--ink-3); }
.rp-legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 4px; vertical-align: -1px; }

/* подразделения */
.rp-tablewrap { overflow-x: auto; margin: 0 -18px; padding: 0 18px; overscroll-behavior-x: contain; }
.rp-table { width: 100%; min-width: 540px; border-collapse: collapse; font-size: 13.5px; }
.rp-table th { font-size: 10.5px; letter-spacing: 0.05em; text-transform: uppercase; color: var(--ink-3); font-weight: 600; padding: 0 6px 10px; white-space: nowrap; border: 0; text-align: left; }
.rp-table td { padding: 9px 6px; border: 0; border-top: 1px solid var(--rp-track); font-variant-numeric: tabular-nums; }
.rp-table th.num, .rp-table td.num { text-align: right; }
.rp-table td small { display: block; font-size: 11.5px; color: var(--ink-3); }
.rp-table td.bad { color: var(--rp-down); font-weight: 650; }
.rp-table tbody tr { cursor: pointer; transition: background-color 120ms ease; }
.rp-table tbody tr.on td { background: color-mix(in srgb, var(--rp-y) 14%, transparent); }
.rp-table tfoot td { background: var(--rp-track); font-weight: 700; border-top: 0; }
.rp-table tfoot td:first-child { border-radius: 10px 0 0 10px; } .rp-table tfoot td:last-child { border-radius: 0 10px 10px 0; }
.rp-table tfoot td small { font-weight: 500; display: block; }
.rp-share { display: flex; align-items: center; gap: 8px; }
.rp-share i { width: 56px; height: 6px; border-radius: 3px; flex: 0 0 auto; }
.rp-share span { font-size: 12px; color: var(--ink-2); min-width: 36px; text-align: right; }

/* тренд */
.rp-plot { position: relative; height: 196px; margin-top: 4px; }
.rp-plot svg { position: absolute; inset: 0 118px 0 0; width: calc(100% - 118px); height: 100%; overflow: visible; }
.rp-endpill { position: absolute; left: calc(100% - 112px); transform: translateY(-50%); padding: 5px 11px; border-radius: 14px; font-size: 12.5px; font-weight: 700; color: #fff; background: linear-gradient(90deg, var(--rp-o), var(--rp-r)); box-shadow: 0 4px 12px rgb(232 88 42 / 0.28); white-space: nowrap; }
.rp-endpill.gray { background: var(--rp-gray); color: var(--ink); box-shadow: 0 4px 12px rgb(22 24 26 / 0.08); }
.rp-xaxis { position: relative; height: 18px; margin-right: 118px; }
.rp-xaxis span { position: absolute; top: 2px; transform: translateX(-50%); font-size: 11px; color: var(--ink-3); white-space: nowrap; }
.rp-xaxis span:first-child { transform: none; }

/* разделы + сроки в одной карточке */
.rp-split { display: grid; grid-template-columns: 1fr 1fr; }
.rp-split > div { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.rp-split > div:first-child { padding-right: 18px; }
.rp-split > div + div { padding-left: 18px; border-left: 1px solid var(--rp-track); }

.rp-list li span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.rp-list li b { text-align: right; font-variant-numeric: tabular-nums; }
.rp-total { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; font-size: 12.5px; color: var(--ink-3); border-top: 1px solid var(--rp-track); padding-top: 10px; margin-top: auto; }
.rp-total b { color: var(--rp-up); font-size: 18px; font-variant-numeric: tabular-nums; }
.rp-week { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; text-align: center; }
.rp-wd { padding: 6px 0 5px; border-radius: 12px; box-shadow: inset 0 0 0 1px var(--rp-track); display: flex; flex-direction: column; align-items: center; gap: 2px; }
.rp-wd small { font-size: 10.5px; color: var(--ink-3); }
.rp-wd b { font-size: 15px; font-variant-numeric: tabular-nums; line-height: 1.1; }
.rp-wd i { width: 5px; height: 5px; border-radius: 3px; background: transparent; }

.rp-wd.today { box-shadow: inset 0 0 0 1.5px var(--ink); }
.rp-dl { display: grid; grid-template-columns: 48px minmax(0, 1fr) auto; gap: 8px; align-items: center; width: 100%; min-height: 40px; padding: 4px 0; border: 0; border-top: 1px solid var(--rp-track); background: none; text-align: left; font-size: 12.5px; cursor: pointer; }

.rp-dl .d { color: var(--ink-3); font-variant-numeric: tabular-nums; }
.rp-dl .t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rp-dl .t b { font-family: var(--font-fig); font-size: 14px; margin-right: 4px; }
.rp-dl.warn .t { color: var(--rp-down); font-weight: 650; }

{"id":"10.02","text":"1–3 капсулы на полке, ручки продеты, фурнитура без упаковки"},{"id":"10.03","text":"Вымытые капсулы расформированы"},{"id":"10.04","text":"Все актуальные сезонные аксессуары выставлены в торговый зал"},{"id":"10.05","text":"Аксессуары у своей гендерной зоны (жен / муж / дет), нет пустых мест при наличии товара"},{"id":"10.06","text":"На аксессуарах есть ценники с актуальной ценой"},{"id":"10.07","text":"Головные уборы: зеркало рядом"}]},{"n":11,"title":"Одежда, Kari sport, home, cosmetics","basis":"Бюллетень","min":7,"items":[{"id":"11.01","text":"Одежда AW2026 в зоне одежды, А5 «3-й товар» в афишетках"},{"id":"11.02","text":"Kari sport: блок распродажи, топперы, «Скидки до 70%», ценники на каждой единице"},{"id":"11.03","text":"Kari home / cosmetics: листовки, ценники 60×40, воблеры «СУПЕР-ЦЕНА» по регламенту"}]},{"n":12,"title":"Подсобка","basis":"Проверка ДП","min":12,"items":[{"id":"12.01","text":"Товар хранится по адресам, адреса читаемы"},{"id":"12.02","text":"Сезонных аксессуаров на складе нет: всё актуальное выставлено в зал"},{"id":"12.03","text":"Порядок на стеллажах: коробки по моделям и размерам, нет хаотичных остатков"},{"id":"12.04","text":"Нет товара на полу, проходы свободны, эвакуационный выход не заблокирован","crit":true},{"id":"12.05","text":"Возвраты, брак и неликвид хранятся отдельно и подписаны"},{"id":"12.06","text":"Товар из приёмки разобран, нет зависших коробок"},{"id":"12.07","text":"POSM-запас (листовки, имиджи, ценники) хранится упорядоченно, устаревшее убрано"},{"id":"12.08","text":"Чистота и порядок, нет посторонних вещей"}]},{"n":13,"title":"Фотоотчёт","basis":"Бюллетень","min":2,"items":[{"id":"13.01","text":"Еженедельный фотоотчёт загружен в Store control в день региона"},{"id":"13.02","text":"Исправления по прошлым замечаниям выложены в группу"}]}]}};

<script>/* Аудит магазина — прототип интерфейса на тестовых данных.
   Хранение: localStorage (состояние) + IndexedDB (фото и подписи). Сервер FastAPI подключается следующим шагом
   через слой Store: все чтения/записи идут только через него. */
(() => {
  "use strict";
  const D = window.AUDIT_DATA;
  const TPL = D.template;
  const APP_VERSION = "0.7.0";
  const STORE_KEY = "audit.sib.v1";
  const PASSWORD = "1234";
  const DUE_DAYS = { 1: 3, 2: 7, 3: 14 };
  const PRIO = {
    1: { name: "Приоритет 1", short: "П1", hint: "срочно, критично" },
    2: { name: "Приоритет 2", short: "П2", hint: "важно, по плану" },
    3: { name: "Приоритет 3", short: "П3", hint: "не срочно" },
  };
  const ESC = [ // эскалация просроченных задач
    { days: 7, who: "region", label: "директору региона" },
    { days: 3, who: "sales", label: "директору по продажам" },
    { days: 1, who: "dp", label: "ДМ и ДП" },
  ];
  const STATUS = {
    open: { label: "Открыта", cls: "" },
    returned: { label: "Возвращена", cls: "mid" },
    review: { label: "На проверке", cls: "wait" },
    accepted: { label: "Принята", cls: "ok" },
  };

  /* ------------------------------------------------------------ utils */
  const $ = (sel, root = document) => root.querySelector(sel);
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const uid = (p) => p + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);

  /* Устройство, с которого идёт работа. Веб-приложение не видит номер телефона и IMEI:
     берём модель и систему из браузера и постоянный код, который телефон получает при первом запуске. */
  let DEVICE = null;
  function deviceId() {
    try { let id = localStorage.getItem("audit.device"); if (!id) { id = "d" + Date.now().toString(36).slice(-4) + Math.random().toString(36).slice(2, 6); localStorage.setItem("audit.device", id); } return id; }
    catch (e) { return ""; }
  }
  async function readDevice() {
    const ua = navigator.userAgent || "", d = { id: deviceId(), model: "", os: "", browser: "", mobile: /Mobi|Android|iPhone|iPad/i.test(ua), ua: ua.slice(0, 300) };
    try {
      const ch = navigator.userAgentData;
      if (ch && ch.getHighEntropyValues) {
        const h = await ch.getHighEntropyValues(["model", "platformVersion", "fullVersionList"]);
        d.model = (h.model || "").trim(); d.mobile = !!ch.mobile;
        if (ch.platform) d.os = ch.platform + (h.platformVersion && ch.platform !== "Windows" ? " " + h.platformVersion.split(".")[0] : "");
        const b = (h.fullVersionList || ch.brands || []).find((x) => !/Not.?A.?Brand|^Chromium$/i.test(x.brand));
        if (b) d.browser = `${b.brand.replace("Google ", "")} ${String(b.version).split(".")[0]}`;
      }
    } catch (e) { /* браузер не отдал подробности — берём из строки агента */ }
    const m = (re) => (ua.match(re) || [])[1];
    if (!d.os) d.os = m(/iPhone OS (\d+)/) ? "iOS " + m(/iPhone OS (\d+)/) : m(/CPU OS (\d+)/) ? "iPadOS " + m(/CPU OS (\d+)/) : m(/Android (\d+)/) ? "Android " + m(/Android (\d+)/) : /Windows/.test(ua) ? "Windows" : /Mac OS X/.test(ua) ? "macOS" : /Linux/.test(ua) ? "Linux" : "";
    if (!d.model) { const am = m(/Android [^;)]*; ([^;)]+?)(?: Build[^;)]*)?\)/); d.model = /iPhone/.test(ua) ? "iPhone" : /iPad/.test(ua) ? "iPad" : am && am !== "K" ? am.trim() : ""; }
    if (!d.browser) d.browser = m(/YaBrowser\/(\d+)/) ? "Яндекс Браузер " + m(/YaBrowser\/(\d+)/) : m(/SamsungBrowser\/(\d+)/) ? "Samsung Internet " + m(/SamsungBrowser\/(\d+)/) : m(/Edg\w*\/(\d+)/) ? "Edge " + m(/Edg\w*\/(\d+)/) : m(/(?:Firefox|FxiOS)\/(\d+)/) ? "Firefox " + m(/(?:Firefox|FxiOS)\/(\d+)/) : m(/(?:Chrome|CriOS)\/(\d+)/) ? "Chrome " + m(/(?:Chrome|CriOS)\/(\d+)/) : m(/Version\/(\d+).*Safari/) ? "Safari " + m(/Version\/(\d+).*Safari/) : "";
    return d;
  }
  const devName = (d) => (d.model || (d.mobile ? "Телефон, модель скрыта" : "Компьютер"));
  const devTag = (d) => (d.id ? "№ " + d.id.slice(-4).toUpperCase() : "без кода");
  const DAY = 864e5;
  const today0 = () => { const d = new Date(); d.setHours(0, 0, 0, 0); return d; };
  const ymd = (d) => { const x = new Date(d); return `${x.getFullYear()}-${String(x.getMonth() + 1).padStart(2, "0")}-${String(x.getDate()).padStart(2, "0")}`; };
  const parseYmd = (s) => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
  const MONTHS = ["января", "февраля", "марта", "апреля", "мая", "июня", "июля", "августа", "сентября", "октября", "ноября", "декабря"];
  const MONTHS_NOM = ["январь", "февраль", "март", "апрель", "май", "июнь", "июль", "август", "сентябрь", "октябрь", "ноябрь", "декабрь"];
  const dShort = (d) => { const x = new Date(d); return `${x.getDate()} ${MONTHS[x.getMonth()]}`; };
  const dTime = (d) => { const x = new Date(d); return `${dShort(x)}, ${String(x.getHours()).padStart(2, "0")}:${String(x.getMinutes()).padStart(2, "0")}`; };
  const plural = (n, one, few, many) => { const a = Math.abs(n) % 100, b = a % 10; if (a > 10 && a < 20) return many; if (b > 1 && b < 5) return few; if (b === 1) return one; return many; };
  const daysBetween = (a, b) => Math.round((parseYmd(ymd(b)) - parseYmd(ymd(a))) / DAY);
  // Срок исправления: дата + время. Без времени (старые и тестовые задачи) срок — конец дня.
  const DUE_TIME = "18:00";
  const dueAt = (t) => { const d = parseYmd(t.due), [h, m] = (t.dueTime || "23:59").split(":").map(Number); d.setHours(h, m, 0, 0); return d; };
  const dueLabel = (t) => (t.due ? `${dShort(parseYmd(t.due))}${t.dueTime ? `, ${t.dueTime}` : ""}` : "—");
  const dueFields = (key, due, time, attr = "") => `<div class="field"><span class="lbl">Срок исправления</span><div class="duerow">
      <label class="sr-only" for="d-${key}">Дата</label><input class="input" type="date" id="d-${key}" ${attr}data-due="${key}" value="${due}" min="${ymd(today0())}" required>
      <label class="sr-only" for="dt-${key}">Время</label><input class="input" type="time" id="dt-${key}" ${attr}data-duetime="${key}" value="${time || ""}" step="900"></div>
      <span class="hint">До какой даты и времени ДМ должен исправить. Без времени — до конца дня.</span></div>`;
  const sameMonth = (d) => { const x = new Date(d), t = new Date(); return x.getFullYear() === t.getFullYear() && x.getMonth() === t.getMonth(); };
  const MONTHS_LOC = ["январе", "феврале", "марте", "апреле", "мае", "июне", "июле", "августе", "сентябре", "октябре", "ноябре", "декабре"];
  const monthName = () => MONTHS_NOM[new Date().getMonth()];
  const monthLoc = () => MONTHS_LOC[new Date().getMonth()];

  function rng(seed) { // mulberry32
    let a = 0; for (const ch of String(seed)) a = (a * 31 + ch.charCodeAt(0)) | 0;
    return () => { a |= 0; a = (a + 0x6d2b79f5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
  }

  /* ---------- figures: price-tag numerals ---------- */
  function fig(value, { dec = 0, unit = "", cls = "" } = {}) {
    if (value === null || value === undefined || Number.isNaN(value)) return `<span class="fig na ${cls}">—</span>`;
    const v = Math.round(value * 10 ** dec) / 10 ** dec;
    const [i, f] = v.toFixed(dec).split(".");
    return `<span class="fig ${cls}"><span class="fig-roll">${i}</span>${f ? `<span class="k">,${f}</span>` : ""}${unit ? `<span class="u">${unit}</span>` : ""}</span>`;

  /* ------------------------------------------------------------ сервер пилота: режим определяется при запуске */
  // Есть сервер (api/health отвечает) — данные общие для всех ролей. Нет (GitHub Pages, файл) — демо в браузере.
  // Приложение с GitHub Pages работает с сервером пилота по ссылке ...?api=https://адрес-сервера.
  // Адрес запоминается на телефоне; ?api=off возвращает демо-режим.
  const API_LS = "audit.api";
  const REMOTE_API = (() => {
    try {
      const u = new URL(location.href), a = u.searchParams.get("api");
      if (a !== null) {
        const v = a.trim().replace(/\/+$/, "");
        if (!v || v === "off") localStorage.removeItem(API_LS);
        else if (/^https:\/\/[a-z0-9.-]+(:\d+)?$/i.test(v)) localStorage.setItem(API_LS, v.toLowerCase());
        u.searchParams.delete("api");
        history.replaceState(null, "", u.pathname + u.search + u.hash);
      }
      return localStorage.getItem(API_LS) || "";
    } catch (e) { return ""; }
  })();
  const SRV = { on: false, base: REMOTE_API ? REMOTE_API + "/api/" : "api/", remote: REMOTE_API, stores: null, status: "ok" };
  // Бесплатный туннель tuna показывает браузеру страницу-предупреждение; этот заголовок её пропускает.
  const srvHdr = (h = {}) => ({ "tuna-skip-browser-warning": "1", ...h });
  async function srvFetch(path, opt = {}) {
    const s = Store.get(), token = s && s.session && s.session.token;
    const r = await fetch(SRV.base + path, { ...opt, cache: "no-store", headers: srvHdr({ ...(opt.headers || {}), ...(token ? { Authorization: "Bearer " + token } : {}) }) });
    if (r.status === 401 && token) { Sync.signedOut(); throw new Error("auth"); }
    return r;
  }
  const errText = async (r, fallback) => { try { const j = await r.json(); return (j && j.detail) || fallback; } catch (e) { return fallback; } };

  /* ------------------------------------------------------------ photo store (IndexedDB + сервер) */
  const Photos = (() => {
    const mem = new Map();
    let dbp = null;
    const open = () => {
      if (dbp) return dbp;
      dbp = new Promise((res) => {
        try {
          const r = indexedDB.open("audit-photos", 1);
          r.onupgradeneeded = () => r.result.createObjectStore("p");
          r.onsuccess = () => res(r.result);
          r.onerror = () => res(null);
        } catch (e) { res(null); }
      });
      return dbp;
    };
    const idbPut = async (id, dataUrl) => { const db = await open(); if (!db) return; await new Promise((res) => { try { const tx = db.transaction("p", "readwrite"); tx.objectStore("p").put(dataUrl, id); tx.oncomplete = tx.onerror = () => res(); } catch (e) { res(); } }); };
    const idbGet = async (id) => { const db = await open(); if (!db) return null; return new Promise((res) => { try { const r = db.transaction("p").objectStore("p").get(id); r.onsuccess = () => res(r.result || null); r.onerror = () => res(null); } catch (e) { res(null); } }); };
    const toBlob = (dataUrl) => { const [h, b] = dataUrl.split(","); const bin = atob(b); const u = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i); return new Blob([u], { type: (h.match(/data:([^;]+)/) || [])[1] || "image/jpeg" }); };
    const toDataUrl = (blob) => new Promise((res) => { const fr = new FileReader(); fr.onload = () => res(fr.result); fr.onerror = () => res(null); fr.readAsDataURL(blob); });
    const pending = new Map(); // id → promise of a server fetch already in flight
    return {
      async put(id, dataUrl, store) {
        mem.set(id, dataUrl);
        await idbPut(id, dataUrl);
        if (SRV.on && store) { const q = Store.get().sync.photoQ; if (!q.some((x) => x.id === id)) q.push({ id, store }); Store.saveLocal(); }
      },
      async get(id) {
        if (mem.has(id)) return mem.get(id);
        const local = await idbGet(id);
        if (local) { mem.set(id, local); return local; }
        if (!SRV.on) return null;
        if (!pending.has(id)) pending.set(id, (async () => {
          try { const r = await srvFetch("photos/" + id); if (!r.ok) return null; const url = await toDataUrl(await r.blob()); if (url) { mem.set(id, url); idbPut(id, url); } return url; }
          catch (e) { return null; } finally { setTimeout(() => pending.delete(id), 5000); }
        })());
        return pending.get(id);
      },
      async flush() { // отправить на сервер снятые фото, по одному
        const q = Store.get().sync.photoQ;
        while (q.length) {
          const { id, store } = q[0];
          const url = mem.get(id) || (await idbGet(id));
          if (!url) { q.shift(); continue; }
          const r = await srvFetch(`photos/${id}?store=${encodeURIComponent(store)}`, { method: "POST", headers: { "Content-Type": toBlob(url).type }, body: toBlob(url) });
          if (!r.ok && r.status !== 409) throw new Error(await errText(r, "Фото не отправилось"));
          q.shift(); Store.saveLocal();
        }
      },
      async del(id) {
        mem.delete(id);
        if (SRV.on) { const q = Store.get().sync.photoQ, i = q.findIndex((x) => x.id === id); if (i >= 0) q.splice(i, 1); }
        const db = await open(); if (!db) return;
        try { db.transaction("p", "readwrite").objectStore("p").delete(id); } catch (e) { /* ignore */ }
      },
      async clear() { mem.clear(); const db = await open(); if (!db) return; try { db.transaction("p", "readwrite").objectStore("p").clear(); } catch (e) { /* ignore */ } },
    };
  })();

  // fill <img data-photo="id"> after render
  async function hydratePhotos(root = document) {
    for (const img of root.querySelectorAll("img[data-photo]")) {
      if (img.src) continue;
      const url = await Photos.get(img.dataset.photo);
      if (url) img.src = url; else img.alt = SRV.on ? "Фото ещё не загружено или удалено по сроку хранения" : "Фото не найдено на этом устройстве";
    }
  }

  // compress + stamp: магазин, дата/время, пункт
  function processPhoto(file, stampLines) {
    return new Promise((resolve, reject) => {
      const url = URL.createObjectURL(file);
      const img = new Image();
      img.onload = () => {
        const max = 1600, k = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
        const w = Math.round(img.naturalWidth * k), h = Math.round(img.naturalHeight * k);
        const c = document.createElement("canvas"); c.width = w; c.height = h;
        const g = c.getContext("2d");
        g.drawImage(img, 0, 0, w, h);
        const fs = Math.max(14, Math.round(w / 38)), pad = Math.round(fs * 0.6), lh = Math.round(fs * 1.3);
        g.font = `600 ${fs}px system-ui, sans-serif`;
        const bw = Math.min(w, Math.max(...stampLines.map((l) => g.measureText(l).width)) + pad * 2), bh = lh * stampLines.length + pad;
        g.fillStyle = "rgba(0,0,0,0.62)"; g.fillRect(0, h - bh, bw, bh);
        g.fillStyle = "#f8bbd9"; g.fillRect(0, h - bh, Math.max(4, Math.round(fs / 4)), bh);
        g.fillStyle = "#fff"; g.textBaseline = "top";
        stampLines.forEach((l, i) => g.fillText(l, pad, h - bh + pad / 2 + i * lh));
        URL.revokeObjectURL(url);
        resolve(c.toDataURL("image/jpeg", 0.8));
      };
      img.onerror = () => { URL.revokeObjectURL(url); reject(new Error("Не удалось открыть фото. Попробуйте снять ещё раз.")); };
      img.src = url;
    });
  }

  /* ------------------------------------------------------------ state store */
  const COLS = ["visits", "tasks", "reports", "reviews", "comments"];
  const SRV_KEY = "audit.sib.srv1";
  const emptySrv = () => ({ ver: 1, mode: "srv", seeded: false, session: null, visits: [], tasks: [], reports: [], reviews: [], comments: [], drafts: {}, sync: { seq: 0, vers: {}, hashes: {}, photoQ: [] } });
  const Store = (() => {
    let s = null;
    const key = () => (SRV.on ? SRV_KEY : STORE_KEY);
    const load = () => { try { const raw = localStorage.getItem(key()); return raw ? JSON.parse(raw) : null; } catch (e) { return null; } };
    const saveLocal = () => { try { localStorage.setItem(key(), JSON.stringify(s)); return true; } catch (e) { toast("Не хватает места в браузере: часть данных не сохранилась"); return false; } };
    return {
      init() {
        s = load();
        if (SRV.on) { if (!s || s.ver !== 1 || s.mode !== "srv") s = emptySrv(); }
        else if (!s || s.ver !== 1) s = seed();
        else if (!s.reports) s.reports = seedReports();
        for (const c of COLS) if (!Array.isArray(s[c])) s[c] = [];
        saveLocal(); return s;
      },
      get: () => s,
      save() { const ok = saveLocal(); if (SRV.on) Sync.soon(); return ok; },
      saveLocal,
      async wipe() { await Photos.clear(); s = emptySrv(); saveLocal(); }, // выход в режиме сервера: на телефоне не остаётся чужих данных
      async reset() { await Photos.clear(); s = seed(); s.session = null; saveLocal(); },
    };
  })();

  /* ------------------------------------------------------------ синхронизация с сервером */
  const Sync = (() => {
    let chain = Promise.resolve(), soonT = null, pollT = null, needRender = false, firstAt = 0;
    const hs = (str) => { let x = 0; for (let i = 0; i < str.length; i++) x = (x * 31 + str.charCodeAt(i)) | 0; return x + ":" + str.length; };
    const st = () => S().sync;
    const dirtyDocs = () => COLS.flatMap((kind) => S()[kind].filter((d) => st().hashes[kind + ":" + d.id] !== hs(JSON.stringify(d))).map((d) => [kind, d]));
    const replaceInPlace = (kind, data) => { // экраны держат ссылки на объекты — обновляем на месте
      const arr = S()[kind], cur = arr.find((x) => x.id === data.id);
      if (!cur) { arr.push(data); return; }
      for (const k of Object.keys(cur)) delete cur[k];
      Object.assign(cur, data);
    };
    function setStatus(s) {
      SRV.status = s;
      const el = document.getElementById("syncPill"); if (!el) return;
      const n = dirtyDocs().length + st().photoQ.length;
      el.hidden = s === "ok" && !n;
      el.textContent = s === "offline" ? `нет связи${n ? ` · ждёт отправки ${n}` : ""}` : s === "error" ? "ошибка сохранения" : n ? `отправка… ${n}` : "";
      el.className = "syncpill " + s;
    }
    const quiet = () => { // не перерисовывать под руками у человека
      const a = document.activeElement;
      return ["visit", "summary"].includes(route.name) || document.querySelector(".sheet") || (a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)) || (route.name === "task" && screens.task.draft && (screens.task.draft.photos.length || screens.task.draft.comment));
    };
    function maybeRender() { if (quiet()) { needRender = true; return; } needRender = false; render(false); }
    async function push() {
      if (!S().session || !S().session.token) return;
      await Photos.flush();
      let conflict = false;
      for (const [kind, doc] of dirtyDocs()) {
        const k = kind + ":" + doc.id, json = JSON.stringify(doc);
        const r = await srvFetch(`docs/${kind}/${encodeURIComponent(doc.id)}`, { method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ ver: st().vers[k] || 0, data: doc }) });
        if (r.ok) { const j = await r.json(); st().vers[k] = j.ver; st().hashes[k] = hs(json); continue; }
        if (r.status === 409) {
          const j = await r.json().catch(() => ({}));
          if (j && j.data) { replaceInPlace(kind, j.data); st().vers[k] = j.ver; st().hashes[k] = hs(JSON.stringify(j.data)); conflict = true; continue; }
          toast((j && j.detail) || "Запись не сохранилась: её изменили"); st().hashes[k] = hs(json); continue;
        }
        const msg = await errText(r, "Сервер не принял изменения");
        if (r.status === 403 || r.status === 400) { st().hashes[k] = hs(json); toast(msg); continue; } // не повторять бесконечно
        throw new Error(msg);
      }
      Store.saveLocal();
      if (conflict) { toast("Запись изменили на другом устройстве — показана свежая версия"); maybeRender(); }
    }
    async function pull() {
      if (!S().session || !S().session.token) return;
      const r = await srvFetch(`sync?since=${st().seq}`);
      if (!r.ok) throw new Error(await errText(r, "Сервер не ответил"));
      const j = await r.json();
      let changed = false;
      for (const d of j.docs) {
        const k = d.kind + ":" + d.id;
        if (!COLS.includes(d.kind) || d.ver <= (st().vers[k] || 0)) continue;
        const local = S()[d.kind].find((x) => x.id === d.id);
        if (local && st().hashes[k] !== hs(JSON.stringify(local))) continue; // есть неотправленная правка — решит push
        replaceInPlace(d.kind, d.data); st().vers[k] = d.ver; st().hashes[k] = hs(JSON.stringify(d.data)); changed = true;
      }
      st().seq = j.seq; Store.saveLocal();
      if (changed) maybeRender();
    }
    const run = (fn) => (chain = chain.then(fn).then(() => setStatus("ok"), (e) => { if (e && e.message === "auth") return; setStatus(navigator.onLine === false || e instanceof TypeError ? "offline" : "error"); if (!(e instanceof TypeError)) console.warn(e); }));
    return {
      soon() { // пауза 0,7 с после правки, но не дольше 5 с подряд — при быстрой работе данные всё равно уходят
        const t = Date.now(); if (!firstAt) firstAt = t;
        clearTimeout(soonT); setStatus(SRV.status);
        soonT = setTimeout(() => { firstAt = 0; run(push); }, Math.max(0, Math.min(700, 5000 - (t - firstAt))));
      },
      now() { return run(async () => { await push(); await pull(); }); },
      start() {
        clearInterval(pollT); pollT = setInterval(() => { if (document.visibilityState === "visible") this.now(); }, 20000);
        return this.now();
      },
      stop() { clearInterval(pollT); clearTimeout(soonT); },
      paint() { setStatus(SRV.status); if (needRender && !quiet()) { needRender = false; } },
      pendingRender: () => needRender,
      async signedOut() { this.stop(); await Store.wipe(); stack.length = 0; route = { name: "home", p: {} }; render(true); toast("Сессия закончилась — войдите снова"); },
    };
  })();
  document.addEventListener("visibilitychange", () => { if (SRV.on && document.visibilityState === "visible" && S() && S().session) Sync.now(); });
  window.addEventListener("online", () => { if (SRV.on && S() && S().session) Sync.now(); });

  /* ------------------------------------------------------------ users */
  const STORES = Object.fromEntries(D.stores.map((x) => [x.id, x]));
  const DP_BY_DIV = Object.fromEntries(D.dps.map((u) => [u.div, u]));
  const USERS = [
    ...D.dps,
    ...D.stores.map((x) => ({ login: "dm" + x.id, role: "dm", name: `Директор магазина ${x.id}`, short: `ДМ ${x.id}`, store: x.id, div: x.div })),
    { login: "sales", role: "sales", name: "Директор по продажам региона", short: "ДПР" },
    { login: "region", role: "region", name: "Директор региона", short: "ДР" },
  ];
  const userBy = (login) => USERS.find((u) => u.login === login);
  const ROLE_NAME = { dp: "ДП", dm: "ДМ", sales: "ДПР · директор по продажам", region: "ДР · директор региона" };

  /* ------------------------------------------------------------ template helpers */
  const ALL_ITEMS = TPL.sections.flatMap((s) => s.items.map((it) => ({ ...it, sec: s.n, secTitle: s.title })));
  const ITEM = Object.fromEntries(ALL_ITEMS.map((i) => [i.id, i]));
  function applies(item, params) {
    if (!item.cond) return true;
    if (item.cond === "vit_full") return params.vit === "full";
    if (item.cond === "vit_free") return params.vit === "free";
    if (item.cond === "vit_end") return params.vit === "end";
    if (item.cond === "cash2") return !!params.cash2;
    return true;
  }
  const visibleItems = (sec, params) => sec.items.filter((i) => applies(i, params));

  function computeScore(v) {
    let ok = 0, fail = 0, na = 0, crit = false, answered = 0, total = 0;
    for (const sec of TPL.sections) for (const it of visibleItems(sec, v.params)) {
      total++;
      const a = v.answers[it.id]; if (!a || !a.v) continue;
      answered++;
      if (a.v === "ok") ok++; else if (a.v === "fail") { fail++; if (it.crit) crit = true; } else na++;
    }
    const score = ok + fail ? (ok / (ok + fail)) * 100 : null;
    return { ok, fail, na, crit, answered, total, score };
  }
  function secStat(v, sec) {
    let ok = 0, fail = 0, na = 0; const items = visibleItems(sec, v.params);
    for (const it of items) { const a = v.answers[it.id]; if (!a) continue; if (a.v === "ok") ok++; else if (a.v === "fail") fail++; else if (a.v === "na") na++; }
    return { ok, fail, na, n: items.length, done: ok + fail + na === items.length, score: ok + fail ? (ok / (ok + fail)) * 100 : null };
  }

  /* ------------------------------------------------------------ seed (тестовые данные) */
  const SEED_DEV = [ // тестовые телефоны ДП 1…5
    { id: "dsd1a7k", model: "SM-A546E", os: "Android 14", browser: "Chrome 141", mobile: true },
    { id: "dsd2q4m", model: "iPhone", os: "iOS 18", browser: "Safari 18", mobile: true },
    { id: "dsd3x9p", model: "Redmi Note 12 Pro", os: "Android 13", browser: "Яндекс Браузер 25", mobile: true },
    { id: "dsd4c2r", model: "CPH2591", os: "Android 14", browser: "Chrome 141", mobile: true },
    { id: "dsd5t8w", model: "Pixel 7", os: "Android 15", browser: "Chrome 141", mobile: true },
  ];
  function seed() {
    const st = { ver: 1, seeded: true, session: null, visits: [], tasks: [], drafts: {}, reports: [] };
    const t0 = today0();
    for (const store of D.stores) {
      const r = rng("v" + store.id);
      const lastAgo = Math.floor(3 + r() * 50); // 3..52 дня назад
      const ago = [lastAgo, lastAgo + 26 + Math.floor(r() * 10)];
      const quality = 0.88 + r() * 0.11;

  function bindTask(root, t) {

  // ---- Директора: статистика посещений ДП, список всех магазинов, визиты ДП
  const WEEKS = 8;
  function dpStats(dp) {
    const ss = D.stores.filter((x) => x.div === dp.div), ids = new Set(ss.map((x) => x.id));
    const vs = S().visits.filter((v) => v.status === "signed" && ids.has(v.store)).sort((a, b) => b.startedAt.localeCompare(a.startedAt));
    const month = ss.filter((x) => visitedThisMonth(x.id)), left = ss.filter((x) => !visitedThisMonth(x.id));
    const w0 = parseYmd(weekStart()).getTime(), weeks = Array(WEEKS).fill(0);
    for (const v of vs) { const k = Math.round((w0 - parseYmd(weekStart(v.startedAt)).getTime()) / (7 * DAY)); if (k >= 0 && k < WEEKS) weeks[WEEKS - 1 - k]++; }
    const recent = vs.filter((v) => daysBetween(v.startedAt, new Date()) <= 90);
    const sc = recent.filter((v) => v.score !== null).map((v) => v.score);
    const mins = recent.filter((v) => v.endedAt).map((v) => (new Date(v.endedAt) - new Date(v.startedAt)) / 6e4);
    const now = new Date(), frac = now.getDate() / new Date(now.getFullYear(), now.getMonth() + 1, 0).getDate();
    const cover = ss.length ? month.length / ss.length : 1;
    return { dp, ss, vs, month, left, weeks, last: vs[0] || null, cnt90: recent.length, avgScore: sc.length ? sc.reduce((a, b) => a + b, 0) / sc.length : null,
      avgMin: mins.length ? mins.reduce((a, b) => a + b, 0) / mins.length : null, fails: recent.length ? recent.reduce((a, v) => a + v.fails, 0) / recent.length : null,
      red: recent.filter((v) => v.crit || v.score < 75).length, behind: cover < frac - 0.15 && left.length > 0, cover };
  }
  // устройство визита: первое у ДП / привычное / новое (подтверждает ДПР или ДР)
  function devStatus(v) {
    const d = v.device; if (!d || !d.id) return null;
    const prev = S().visits.filter((x) => x.dp === v.dp && x.id !== v.id && x.status === "signed" && x.device && x.device.id && x.startedAt < v.startedAt);
    const same = prev.filter((x) => x.device.id === d.id).length;
    const cnt = {}; for (const x of prev) if (x.device.id !== d.id) cnt[x.device.id] = (cnt[x.device.id] || 0) + 1;
    const others = Object.keys(cnt).sort((a, b) => cnt[b] - cnt[a]).slice(0, 2).map((id) => prev.find((x) => x.device.id === id).device); // два самых частых
    const switched = !!(v.signDevice && v.signDevice.id !== d.id);
    if (!prev.length) return { k: "first", label: "первое устройство", cls: "wait", same, others, switched };
    if (same) return { k: "known", label: "привычное устройство", cls: "ok", same, others, switched };
    return { k: "new", label: v.deviceOk ? "новое · подтверждено" : "новое устройство", cls: v.deviceOk ? "ok" : "bad", same, others, switched };

  screens.svod = () => {
